<!--#AHEAD Crystal Star vocabulary-->
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: {{t.fBody}}; background: {{t.pageBg}}; display: flex; flex-direction: column;">
<!--#ABG-->
<!--#ANAV-->

  <main style="position: relative; z-index: 3; flex-grow: 1; padding: 10px 44px 28px; display: flex; flex-direction: column; min-height: 0;">
    <div style="display: flex; align-items: flex-end; gap: 20px;">
      <div class="nk-rise">
        <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: 0.16em; color: {{t.crimsonText}};">MY WORDS <span style="color: {{t.text3}};">//</span> 4 DECKS</div>
        <h1 style="margin: 4px 0 0; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: 0.01em; background: {{t.metal}}; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a0820) drop-shadow(0 0 18px rgb(255 42 77 / 0.6));">VOCABULARY</h1>
        <p style="margin: 8px 0 0; font-size: 14px; color: {{t.text2}};"><span style="font-family: {{t.fMono}}; font-weight: 600; color: {{t.textStrong}};">1,228</span> words across 4 decks · <span style="font-weight: 900; color: {{t.crimsonText}};">12 due today</span></p>
      </div>

      <div class="nk-rise-2" style="display: flex; align-items: flex-end; gap: 6px; margin-left: 18px;">
        <div class="nk-float" style="width: 86px; height: 86px; flex-shrink: 0;">
<!--#MASCOT hint-->
        </div>
        <div style="position: relative; margin-bottom: 8px; width: 238px; box-sizing: border-box; padding: 9px 14px 10px; clip-path: {{t.chamfer}}; background: {{t.panel}}; box-shadow: inset 0 0 0 1px {{t.panelEdge2}};">
          <span aria-hidden="true" style="position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; background: linear-gradient(180deg, #5ef2ff, #ff2a4d);"></span>
          <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 11px; letter-spacing: 0.12em; color: {{t.holoText}};">LUMI · LINK</div>
          <div style="margin-top: 2px; font-weight: 800; font-size: 13px; line-height: 1.35; color: {{t.textStrong}};">2 thẻ Hoa sắp héo. Tưới (ôn) trước nhé!</div>
        </div>
      </div>

      <label class="nk-rise-2" style="margin-left: auto; position: relative; width: 320px; height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; clip-path: {{t.chamferSm}}; background: {{t.chip}}; box-shadow: inset 0 0 0 1px {{t.lineStrong}}; display: flex; align-items: center; gap: 10px; color: {{t.text2}};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search words</span>
        <input placeholder="Search words or meanings" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 600;">
        <span style="height: 24px; padding: 0 8px; background: {{t.chip}}; box-shadow: inset 0 0 0 1px {{t.line}}; font-family: {{t.fMono}}; font-size: 11px; display: flex; align-items: center;">/</span>
      </label>
      <button class="nk-lift nk-rise-2" style="position: relative; height: 48px; padding: 0 26px; border: 0; transform: skewX(-14deg); background: {{t.primaryBg}}; color: #ffffff; cursor: pointer; overflow: hidden; filter: drop-shadow(0 0 14px rgb(255 42 77 / 0.6));">
        <span aria-hidden="true" class="nk-shine" style="position: absolute; top: 0; bottom: 0; left: 0; width: 40px; background: rgb(255 255 255 / 0.35);"></span>
        <span style="position: relative; display: flex; align-items: center; gap: 8px; transform: skewX(14deg); font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 16px; letter-spacing: 0.06em;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>CREATE CARD</span>
      </button>
    </div>

    <div class="nk-rise-2" style="margin-top: 18px; display: flex; align-items: center; gap: 18px; padding-bottom: 14px; border-bottom: 1px solid {{t.line}};">
      <div role="tablist" aria-label="Decks" style="display: flex; gap: 6px;">
        <sc-for list="{{decks}}" as="d" hint-placeholder-count="5">
          <button role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="height: 36px; padding: 0 16px; border: 0; transform: skewX(-16deg); background: {{d.bg}}; box-shadow: {{d.edge}}; cursor: pointer;"><span style="display: flex; align-items: center; gap: 8px; transform: skewX(16deg); font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: {{d.color}};">{{d.name}}<span style="font-family: {{t.fMono}}; font-style: normal; font-weight: 500; font-size: 11.5px; opacity: 0.75;">{{d.count}}</span></span></button>
        </sc-for>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 32px; padding: 0 12px; border: 0; clip-path: {{t.chamferSm}}; background: {{f.bg}}; box-shadow: {{f.edge}}; color: {{f.color}}; font-family: {{t.fBody}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 7px; cursor: pointer;"><span style="height: 16px; min-width: 16px; padding: 0 4px; box-sizing: border-box; clip-path: {{t.chamferSm}}; background: {{f.chipBg}}; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 10px; color: #ffffff; display: flex; align-items: center; justify-content: center;">{{f.mark}}</span>{{f.label}}</button>
        </sc-for>
        <span aria-hidden="true" style="width: 1px; height: 22px; margin: 0 6px; background: {{t.line}};"></span>
        <div role="group" aria-label="View" style="display: flex; gap: 3px;">
          <button aria-label="Grid view" aria-pressed="true" style="width: 38px; height: 32px; border: 0; clip-path: {{t.chamferSm}}; background: {{t.primaryBg}}; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6.5" height="6.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5"></rect></svg></button>
          <button aria-label="List view" aria-pressed="false" style="width: 38px; height: 32px; border: 0; clip-path: {{t.chamferSm}}; background: {{t.chip}}; box-shadow: inset 0 0 0 1px {{t.line}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
        </div>
      </div>
    </div>

    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 272px; gap: 18px 20px; perspective: 1100px;">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
        <div class="{{c.rise}}" style="position: relative; perspective: 1100px;">
        <a href="#" onMouseEnter="{{c.enter}}" onMouseMove="{{c.move}}" onMouseLeave="{{c.leave}}" style="position: absolute; inset: 0; display: block; text-decoration: none; color: {{t.text}}; transform: {{c.transform}}; transition: transform 180ms ease-out, filter 220ms ease; filter: drop-shadow(0 0 {{c.glowR}}px {{c.glow}});">
          <div style="position: absolute; inset: 0; clip-path: {{t.chamfer}}; overflow: hidden;">
            <div class="{{c.rimCls}}" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; background: {{c.rim}};"></div>
          </div>
          <div style="position: absolute; inset: 2px; clip-path: {{t.chamfer}}; background: {{t.cardFront}}; display: flex; flex-direction: column; overflow: hidden;">
            <div style="position: relative; flex-shrink: 0; height: 116px; overflow: hidden; background: {{c.cover}};">
              <sc-if value="{{c.hasImage}}" hint-placeholder-val="{{true}}">
                <img src="{{c.image}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scale({{c.imgScale}}); transition: transform 300ms ease; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, #000 55%, transparent 100%);">
              </sc-if>
              <sc-if value="{{c.noImage}}" hint-placeholder-val="{{false}}">
                <div aria-hidden="true" style="position: absolute; right: 8px; bottom: -30px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 140px; line-height: 1; color: {{c.glyph}};">{{c.initial}}</div>
                <div style="position: absolute; left: 14px; bottom: 12px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: {{c.labelColor}};">{{c.category}}</div>
              </sc-if>
              <span style="position: absolute; top: 10px; left: 10px; height: 22px; padding: 0 9px; clip-path: {{t.chamferSm}}; background: {{c.rimFlat}}; display: flex; align-items: center; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 13px; color: #ffffff; text-shadow: 0 1px 0 #7a0820;">{{c.grade}}</span>
              <sc-if value="{{c.due}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; top: 10px; left: 50px; height: 22px; padding: 0 9px; transform: skewX(-14deg); background: {{t.primaryBg}}; display: flex; align-items: center;"><span style="transform: skewX(14deg); font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 11px; letter-spacing: 0.1em; color: #ffffff;">DUE</span></span>
              </sc-if>
              <sc-if value="{{c.starred}}" hint-placeholder-val="{{false}}">
                <span aria-label="Starred" style="position: absolute; top: 8px; right: 10px; width: 26px; height: 26px; filter: drop-shadow(0 0 8px rgb(255 209 102 / 0.8));"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 1.5l3 7.1 7.7.6-5.9 5 1.8 7.5L12 17.7l-6.6 4 1.8-7.5-5.9-5 7.7-.6z" fill="#ffd166" stroke="#7a0820" stroke-width="0.8"></path></svg></span>
              </sc-if>
              <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: {{c.spotOp}}; transition: opacity 200ms ease; background: radial-gradient(circle 120px at {{c.mx}}% {{c.my}}%, rgb(255 255 255 / 0.35), transparent 70%);"></div>
            </div>
            <div style="position: relative; flex-grow: 1; padding: 6px 16px 14px; display: flex; flex-direction: column;">
              <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.gradeText}};">{{c.tierLabel}} <span style="color: {{t.text3}};">// {{c.pos}}</span></div>
              <div style="margin-top: 6px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 27px; line-height: 1.02; color: {{t.textStrong}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.pre}}<span style="color: {{t.crimsonText}};">{{c.stress}}</span>{{c.rest}}</div>
              <div style="margin-top: 4px; font-family: {{t.fMono}}; font-size: 12px; color: {{t.text3}};">{{c.ipa}}</div>
              <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px;">
                <span style="font-weight: 700; color: {{t.body}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.meaning}}</span>
                <span style="flex-shrink: 0; font-family: {{t.fMono}}; font-size: 11.5px; font-weight: 600; color: {{c.nextColor}};">{{c.next}}</span>
              </div>
            </div>
            <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: {{c.bandOp}}; transition: opacity 200ms ease; background: linear-gradient(115deg, transparent {{c.band1}}%, rgb(255 255 255 / 0.16) {{c.band2}}%, rgb(94 242 255 / 0.14) {{c.band3}}%, transparent {{c.band4}}%);"></div>
          </div>
        </a>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"onToggleTheme":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { deck: 0, filter: 0, hover: -1, mx: 50, my: 50, rx: 0, ry: 0 };
  }
  renderVals() {
//#ATOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = nkTokens(dark);
    const s = this.state;
    const gradeOf = { new: 'Bud', learning: 'Bloom', mastered: 'Star' };
    const gradeText = { new: t.holoText, learning: t.pinkText, mastered: t.crimsonText };
    const glowOf = { new: 'rgb(94 242 255 / 0.55)', learning: 'rgb(255 143 182 / 0.6)', mastered: 'rgb(255 42 77 / 0.7)' };
    const covers = dark ? {
      cyan: { cover: 'radial-gradient(circle at 20% 0%, rgb(94 242 255 / 0.32), transparent 60%), #0c1a2a', glyph: 'rgb(94 242 255 / 0.2)', label: '#5ef2ff' },
      rose: { cover: 'radial-gradient(circle at 20% 0%, rgb(255 84 112 / 0.38), transparent 60%), #1c0e18', glyph: 'rgb(255 143 182 / 0.2)', label: '#ff9ec0' },
      gold: { cover: 'radial-gradient(circle at 20% 0%, rgb(255 209 102 / 0.32), transparent 60%), #1c1610', glyph: 'rgb(255 209 102 / 0.2)', label: '#ffd166' },
    } : {
      cyan: { cover: 'radial-gradient(circle at 20% 0%, rgb(255 255 255 / 0.7), transparent 60%), #bfe7ff', glyph: 'rgb(10 125 153 / 0.2)', label: '#0a7d99' },
      rose: { cover: 'radial-gradient(circle at 20% 0%, rgb(255 255 255 / 0.7), transparent 60%), #ffd6e6', glyph: 'rgb(196 15 53 / 0.16)', label: '#b3265a' },
      gold: { cover: 'radial-gradient(circle at 20% 0%, rgb(255 255 255 / 0.7), transparent 60%), #fff0c9', glyph: 'rgb(138 90 0 / 0.18)', label: '#8a5a00' },
    };
    const raw = [
      { word: 'Spelling', pre: '', stress: 'Spel', rest: 'ling', ipa: '/ˈspelɪŋ/', pos: 'Noun', meaning: 'Cách đánh vần', tier: 'new', next: 'new', image: '../assets/blob/ed058680c239cce56bb63500ca7dd0e4.jpg' },
      { word: 'Immediate', pre: 'Im', stress: 'me', rest: 'diate', ipa: '/ɪˈmiːdiət/', pos: 'Adj', meaning: 'Ngay lập tức', tier: 'learning', next: 'now', due: true, starred: true, image: '../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg' },
      { word: 'Instant', pre: '', stress: 'In', rest: 'stant', ipa: '/ˈɪnstənt/', pos: 'Noun', meaning: 'Khoảnh khắc', tier: 'mastered', next: '34d', image: '../assets/blob/4e8348b18995828a6faaee433ba17ccd.jpg' },
      { word: 'Permanent', pre: '', stress: 'Per', rest: 'manent', ipa: '/ˈpɜːrmənənt/', pos: 'Adj', meaning: 'Vĩnh viễn', tier: 'learning', next: '2d', category: 'General', cover: 'rose' },
      { word: 'Nurse', pre: '', stress: 'Nurse', rest: '', ipa: '/nɜːrs/', pos: 'Noun', meaning: 'Y tá', tier: 'mastered', next: '21d', category: 'Healthcare', cover: 'cyan', starred: true },
      { word: 'Exact', pre: 'Ex', stress: 'act', rest: '', ipa: '/ɪɡˈzækt/', pos: 'Adj', meaning: 'Chính xác', tier: 'new', next: 'new', category: 'Accuracy', cover: 'gold' },
      { word: 'Recharge', pre: 'Re', stress: 'charge', rest: '', ipa: '/ˌriːˈtʃɑːrdʒ/', pos: 'Verb', meaning: 'Sạc lại; lấy lại sức', tier: 'learning', next: 'now', due: true, category: 'Energy', cover: 'cyan' },
      { word: 'Centre', pre: '', stress: 'Cen', rest: 'tre', ipa: '/ˈsentə/', pos: 'Noun', meaning: 'Trung tâm', tier: 'learning', next: '5d', category: 'Location', cover: 'rose' },
      { word: 'Warden', pre: '', stress: 'War', rest: 'den', ipa: '/ˈwɔːrdn/', pos: 'Noun', meaning: 'Người quản lý', tier: 'new', next: 'new', category: 'People', cover: 'gold' },
      { word: 'Ambition', pre: 'Am', stress: 'bi', rest: 'tion', ipa: '/æmˈbɪʃn/', pos: 'Noun', meaning: 'Hoài bão', tier: 'mastered', next: '48d', category: 'Ambition', cover: 'cyan' },
    ];
    const filterDefs = [
      { label: 'All', key: null, mark: '∗', chip: 'linear-gradient(180deg, #8a93a8, #4a536a)' },
      { label: 'Due', key: 'due', mark: '!', chip: t.primaryBg },
      { label: 'New', key: 'new', mark: 'Bud', chip: t.tier.new.rim },
      { label: 'Learning', key: 'learning', mark: 'Bloom', chip: t.tier.learning.rim },
      { label: 'Mastered', key: 'mastered', mark: 'Star', chip: t.tier.mastered.rim },
    ];
    const fk = filterDefs[s.filter].key;
    const visible = raw.filter(c => !fk || (fk === 'due' ? c.due : c.tier === fk));
    const deckDefs = [['All decks', '1,228'], ['Unassigned', '842'], ['Deep learning', '96'], ['TACN', '170'], ['IELTS', '120']];
    return {
      t, toggleTheme: this.props.onToggleTheme ?? (() => {}),
      nav: nkNav(t, 2), streak: 12,
      bg: { wings: false },
      decks: deckDefs.map(([name, count], i) => {
        const on = s.deck === i;
        return { name, count, selected: on ? 'true' : 'false', pick: () => this.setState({ deck: i }),
          bg: on ? t.primaryBg : t.chip, color: on ? '#ffffff' : t.text2, edge: on ? t.primaryGlow : 'inset 0 0 0 1px ' + t.lineStrong };
      }),
      filters: filterDefs.map((f, i) => {
        const on = s.filter === i;
        return { label: f.label, mark: f.mark, chipBg: f.chip, on: on ? 'true' : 'false', pick: () => this.setState({ filter: i, hover: -1 }),
          bg: on ? (dark ? 'rgb(255 255 255 / 0.14)' : '#ffffff') : 'transparent', color: on ? t.textStrong : t.text2,
          edge: on ? 'inset 0 0 0 1px ' + t.panelEdge : 'inset 0 0 0 1px ' + t.line };
      }),
      cards: visible.map((c, i) => {
        const tv = t.tier[c.tier];
        const cv = covers[c.cover ?? 'cyan'];
        const on = s.hover === i;
        const mastered = c.tier === 'mastered';
        return {
          ...c,
          grade: gradeOf[c.tier], tierLabel: tv.label, gradeText: gradeText[c.tier],
          rim: tv.rim, rimFlat: mastered ? 'linear-gradient(180deg, #ffd166, #ff2a4d 60%, #7a0820)' : tv.rim, rimCls: mastered ? 'nk-rim-spin' : '',
          hasImage: !!c.image, noImage: !c.image, initial: c.word[0], category: c.category ?? '',
          cover: c.image ? t.panelSolid : cv.cover, glyph: cv.glyph, labelColor: cv.label,
          due: !!c.due, starred: !!c.starred,
          next: c.next === 'now' ? 'due now' : c.next === 'new' ? 'unseen' : 'in ' + c.next,
          nextColor: c.next === 'now' ? t.crimsonText : t.text3,
          rise: i < 5 ? 'nk-rise' : 'nk-rise-2',
          transform: on ? 'rotateX(' + s.rx + 'deg) rotateY(' + s.ry + 'deg) translateY(-6px)' : 'none',
          glow: on ? glowOf[c.tier] : (mastered ? 'rgb(255 42 77 / 0.35)' : 'transparent'),
          glowR: on ? 26 : 12,
          imgScale: on ? 1.08 : 1,
          spotOp: on ? 1 : 0, bandOp: on ? 1 : 0,
          mx: on ? s.mx : 50, my: on ? s.my : 50,
          band1: (on ? s.mx : 50) - 26, band2: (on ? s.mx : 50) - 12, band3: (on ? s.mx : 50) - 4, band4: (on ? s.mx : 50) + 6,
          enter: () => this.setState({ hover: i }),
          move: (e) => {
            const r = e.currentTarget.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            this.setState({ hover: i, mx: px * 100, my: py * 100, rx: -(py - 0.5) * 12, ry: (px - 0.5) * 12 });
          },
          leave: () => this.setState({ hover: -1, rx: 0, ry: 0, mx: 50, my: 50 }),
        };
      }),
    };
  }
}
</script>
