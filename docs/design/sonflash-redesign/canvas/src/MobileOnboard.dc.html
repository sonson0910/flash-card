<!--#HEAD Mobile onboarding goal-->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: {{t.pageBg}}; display: flex; flex-direction: column;">
<!--#AMBIENT-->
  <div style="position: relative; z-index: 3; height: 44px; flex-shrink: 0; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; color: {{t.textStrong}};"><span>9:41</span><span style="display: flex; gap: 5px; align-items: center;"><span style="width: 17px; height: 10px; border-radius: 2px; background: {{t.textStrong}}; opacity: 0.85;"></span><span style="width: 24px; height: 11px; box-sizing: border-box; border-radius: 3px; border: 1.5px solid {{t.textStrong}}; padding: 1px;"><span style="display: block; width: 70%; height: 100%; border-radius: 1px; background: {{t.textStrong}};"></span></span></span></div>

  <header style="position: relative; z-index: 3; height: 52px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; gap: 12px;">
    <button aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-label="Step 1 of 5" style="flex-grow: 1; display: flex; gap: 6px;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="flex: 1; height: 5px; border-radius: 5px; background: {{d.bg}}; box-shadow: {{d.glow}};"></span></sc-for>
    </div>
    <button style="height: 40px; padding: 0 6px; border: 0; background: transparent; color: {{t.text2}}; font-size: 14px; font-weight: 600;">Skip</button>
  </header>

  <main style="position: relative; z-index: 2; flex-grow: 1; padding: 18px 20px 0; display: flex; flex-direction: column;">
    <p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text2}};">Step 1 of 5 · Your goal</p>
    <h1 style="margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 36px; line-height: 1.05; letter-spacing: -0.03em; color: {{t.textStrong}};">What are you learning <span style="font-style: {{t.emStyle}}; color: {{t.emColor}}; text-shadow: {{t.emGlow}};">for?</span></h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: {{t.text2}};">We’ll shape your daily session around it.</p>

    <div role="radiogroup" aria-label="Goal" style="margin-top: 20px; display: flex; flex-direction: column; gap: 9px;">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="5">
        <button role="radio" aria-checked="{{g.checked}}" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: {{t.rr}}px; border: {{g.border}}; background: {{g.bg}}; box-shadow: {{g.shadow}}; color: {{t.text}}; text-align: left; display: flex; flex-direction: column; gap: 10px;">
          <span style="display: flex; align-items: center; gap: 12px; width: 100%;">
            <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{g.iconBg}}; color: {{g.iconFg}}; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg></span>
            <span style="flex-grow: 1;"><span style="display: block; font-size: 15px; font-weight: 650; color: {{t.textStrong}};">{{g.label}}</span><span style="display: block; margin-top: 2px; font-size: 12.5px; color: {{t.text2}};">{{g.sub}}</span></span>
            <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: {{g.radio}}; background: {{g.radioBg}}; flex-shrink: 0;"></span>
          </span>
          <sc-if value="{{g.checked}}" hint-placeholder-val="{{false}}">
            <span style="display: flex; align-items: center; gap: 6px; padding-left: 50px;">
              <span style="font-size: 12px; color: {{t.text2}}; margin-right: 2px;">Target band</span>
              <sc-for list="{{bands}}" as="b" hint-placeholder-count="4"><span style="height: 28px; padding: 0 10px; border-radius: 999px; border: {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; display: flex; align-items: center;">{{b.v}}</span></sc-for>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </main>

  <footer style="position: relative; z-index: 3; flex-shrink: 0; padding: 14px 20px 10px; display: flex; flex-direction: column; gap: 10px;">
    <button class="sf-press" style="height: 56px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 16px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 8px;">Continue<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    <div style="text-align: center; font-size: 12px; color: {{t.text3}};">Takes about 60 seconds · you can change this later</div>
    <div style="margin: 6px auto 0; width: 134px; height: 5px; border-radius: 5px; background: {{t.textStrong}}; opacity: 0.8;"></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), rr: dark ? 18 : 14 };
    const accent = dark ? '#28d3f4' : '#b4461a';
    const I = {
      exam: 'M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3zM8 9h6M8 13h4',
      work: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16',
      plane: 'M10.5 13.5 3 11l2-2 7 1 4-4a2 2 0 0 1 3 3l-4 4 1 7-2 2-2.5-7.5',
      read: 'M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z',
      spark: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
    };
    const G = [
      ['exam', 'Pass an exam', 'IELTS, TOEIC, TOEFL', true],
      ['work', 'Work & career', 'Emails, meetings, interviews'],
      ['plane', 'Travel', 'Get around with confidence'],
      ['read', 'Read & watch', 'News, books, YouTube'],
      ['spark', 'Just curious', 'A few new words a day'],
    ];
    return {
      t, grainId: 'monb-grain-' + (dark ? 'd' : 'l'), amb: { ax: -220, ay: -200, bx: 120, by: 520 },
      dots: [0, 1, 2, 3, 4].map(i => ({ bg: i === 0 ? accent : t.track, glow: i === 0 && dark ? '0 0 10px rgb(40 211 244 / 0.7)' : 'none' })),
      goals: G.map(([icon, label, sub, on]) => ({
        icon: I[icon], label, sub, checked: !!on,
        border: on ? (dark ? '1.5px solid transparent' : '1.5px solid #1d1a16') : '1px solid ' + t.line,
        bg: on ? (dark ? t.cardBg + ' padding-box, ' + t.rimLearning + ' border-box' : '#fffcf5') : t.surface,
        shadow: on ? (dark ? '0 0 30px -12px rgb(40 211 244 / 0.6)' : '0 12px 20px -14px rgb(60 40 20 / 0.5)') : t.surfaceShadow,
        iconBg: on ? (dark ? 'rgb(40 211 244 / 0.16)' : '#1d1a16') : t.chipBg,
        iconFg: on ? (dark ? '#7ee6fa' : '#fbf6ec') : t.text2,
        radio: on ? '6px solid ' + accent : '1.5px solid ' + t.lineStrong,
        radioBg: on ? (dark ? '#04141c' : '#fffcf5') : 'transparent',
      })),
      bands: ['6.0', '6.5', '7.0', '7.5+'].map(v => {
        const on = v === '7.0';
        return { v, border: on ? '1px solid ' + accent : '1px solid ' + t.line, bg: on ? t.accentSoft : 'transparent', fg: on ? t.accentText : t.text2 };
      }),
    };
  }
}
</script>
</body>
</html>
