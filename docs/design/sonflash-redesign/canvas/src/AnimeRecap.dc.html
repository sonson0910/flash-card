<!--#AHEAD Crystal Star lesson done-->
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: {{t.fBody}}; background: {{t.pageBg}}; display: flex; flex-direction: column;">
<!--#ABG-->
  <div aria-hidden="true" class="nk-beam" style="position: absolute; z-index: 1; left: 50%; top: -10%; width: 380px; height: 120%; margin-left: -190px; background: linear-gradient(90deg, transparent, {{t.beam}}, rgb(255 255 255 / 0.12), {{t.beam}}, transparent); filter: blur(6px);"></div>

  <header style="position: relative; z-index: 5; height: 70px; flex-shrink: 0; padding: 0 44px; display: flex; align-items: center; gap: 14px;">
    <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 15px; letter-spacing: 0.14em; color: {{t.text2}};">DAY 13 <span style="color: {{t.crimsonText}};">//</span> LESSON COMPLETE</div>
    <button class="nk-lift" onClick="{{toggleTheme}}" aria-label="{{t.toggleLabel}}" style="margin-left: auto; width: 42px; height: 42px; clip-path: {{t.chamferSm}}; border: 0; background: {{t.chip}}; box-shadow: inset 0 0 0 1px {{t.lineStrong}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <sc-if value="{{t.dark}}" hint-placeholder-val="{{true}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{t.light}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></sc-if>
    </button>
  </header>

  <main style="position: relative; z-index: 3; flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 0 56px 30px;">
    <div style="position: relative; width: 1000px; height: 300px; display: flex; justify-content: center;">
      <div aria-hidden="true" class="nk-unfold" style="position: absolute; left: 50px; top: -20px; width: 460px; height: 310px; filter: drop-shadow(0 0 26px rgb(255 42 77 / 0.75));">
<!--#WINGS-->
      </div>
      <div aria-hidden="true" class="nk-unfold" style="position: absolute; right: 50px; top: -20px; width: 460px; height: 310px; transform: scaleX(-1); filter: drop-shadow(0 0 26px rgb(255 42 77 / 0.75));">
<!--#WINGS-->
      </div>
      <div class="nk-stamp" style="position: absolute; left: 50%; top: 0; width: 230px; height: 230px; margin-left: -115px; filter: drop-shadow(0 0 30px rgb(255 42 77 / 0.9));">
<!--#STAR5-->
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-top: 18px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 66px; letter-spacing: -0.02em; background: linear-gradient(180deg, #ffffff 0%, #fff3c4 45%, #ffd166 55%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #7a0820);">STAR</div>
      </div>
      <span aria-hidden="true" class="nk-flare" style="position: absolute; left: 50%; top: 20px; width: 360px; height: 200px; margin-left: -180px;"><span style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: linear-gradient(90deg, transparent, #ffffff, transparent);"></span></span>
      <h1 class="nk-pop-2" style="position: absolute; left: 0; right: 0; bottom: 0; margin: 0; text-align: center; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: 0.02em; background: linear-gradient(180deg, #ffffff 0%, #ffe3ea 46%, #ff8fa3 54%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #7a0820) drop-shadow(0 0 26px rgb(255 42 77 / 0.85));">ALL DONE!</h1>
    </div>

    <div style="margin-top: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div class="{{s.cls}}" style="position: relative; clip-path: {{t.chamfer}}; background: {{t.panel}}; box-shadow: inset 0 0 0 1px {{s.edge}}; padding: 14px 20px 16px;">
          <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: {{s.bar}};"></span>
          <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: 0.14em; color: {{t.text2}};">{{s.label}}</div>
          <div style="margin-top: 2px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 44px; line-height: 1.05; white-space: nowrap; color: {{s.color}};">{{s.value}}</div>
          <div style="font-size: 12.5px; color: {{t.text3}};">{{s.sub}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 16px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; width: 100%;">
      <div class="nk-rise-2" style="clip-path: {{t.chamfer}}; background: {{t.panel}}; box-shadow: inset 0 0 0 1px {{t.panelEdge}}; padding: 16px 22px 18px;">
        <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: 0.14em; color: {{t.crimsonText}};">CARDS GLOWED UP <span style="color: {{t.text3}};">// 3</span></div>
        <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
          <sc-for list="{{ups}}" as="u" hint-placeholder-count="3">
            <div style="position: relative; height: 92px; filter: {{u.glow}};">
              <div style="position: absolute; inset: 0; clip-path: {{t.chamferSm}}; overflow: hidden;"><div class="{{u.spin}}" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; background: {{u.rim}};"></div></div>
              <div style="position: absolute; inset: 2px; clip-path: {{t.chamferSm}}; background: {{t.cardFront}}; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column;">
                <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 20px; color: {{t.textStrong}};">{{u.word}}</div>
                <div style="font-size: 12.5px; color: {{t.text2}};">{{u.vi}}</div>
                <div style="margin-top: auto; display: flex; align-items: center; gap: 6px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 15px;"><span style="color: {{t.text3}};">{{u.from}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.text2}}" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span style="color: {{u.toColor}};">{{u.to}}</span></div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      <div class="nk-rise-3" style="clip-path: {{t.chamfer}}; background: {{t.panel}}; box-shadow: inset 0 0 0 1px {{t.panelEdge2}}; padding: 16px 22px 18px;">
        <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: 0.14em; color: {{t.holoText}};">IELTS BAND PROJECTION</div>
        <div style="margin-top: 8px; display: flex; align-items: baseline; gap: 12px;"><span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 40px; color: {{t.text3}};">6.5</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.holoText}}" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 48px; color: {{t.textStrong}}; filter: drop-shadow(0 0 14px rgb(94 242 255 / 0.6));">7.0</span></div>
        <div style="position: relative; margin-top: 8px; height: 12px; transform: skewX(-24deg); background: {{t.track}};">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 72%; background: linear-gradient(90deg, #5ef2ff, #ff5470, #ff2a4d); box-shadow: 0 0 12px rgb(94 242 255 / 0.6);"></div>
          <div style="position: absolute; left: 78%; top: -4px; bottom: -4px; width: 2px; background: {{t.textStrong}};"></div>
        </div>
        <div style="margin-top: 10px; font-size: 13px; line-height: 1.45; color: {{t.text2}};">~78% of a typical Reading passage is now in your deck. Target 7.0 in about 5 weeks at this pace.</div>
      </div>
    </div>

    <div style="margin-top: auto; width: 100%; display: flex; align-items: center; gap: 12px;">
      <div class="nk-float" style="width: 112px; height: 108px; flex-shrink: 0;">
<!--#MASCOT happy-->
      </div>
      <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: 0.14em; color: {{t.text2}}; margin-right: 6px;">WHAT NEXT</div>
      <sc-for list="{{nexts}}" as="n" hint-placeholder-count="3">
        <button class="nk-lift" style="height: 52px; padding: 0 22px; border: 0; transform: skewX(-14deg); background: {{t.chip}}; box-shadow: inset 0 0 0 1px {{t.lineStrong}}; color: {{t.textStrong}}; cursor: pointer; display: flex; align-items: center;"><span style="transform: skewX(14deg); display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15;"><span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 15px; letter-spacing: 0.04em;">{{n.title}}</span><span style="font-size: 12px; color: {{t.text2}};">{{n.sub}}</span></span></button>
      </sc-for>
      <button class="nk-lift" style="margin-left: auto; height: 60px; padding: 0 34px; border: 0; clip-path: {{t.chamfer}}; background: {{t.primaryBg}}; color: #ffffff; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 20px; letter-spacing: 0.08em; cursor: pointer; filter: drop-shadow(0 0 18px rgb(255 42 77 / 0.7));">CLAIM +146 XP</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
//#ATOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = nkTokens(dark);
    return {
      t, toggleTheme: this.props.onToggleTheme ?? (() => {}),
      bg: { wings: false },
      stats: [
        { label: 'ACCURACY', value: '92%', sub: '11 of 12 on first try', color: t.textStrong, edge: t.panelEdge2, bar: '#5ef2ff', cls: 'nk-slide' },
        { label: 'BEST COMBO', value: 'DREAMY ×9', sub: 'New personal best', color: t.crimsonText, edge: t.panelEdge, bar: '#ff2a4d', cls: 'nk-slide-2' },
        { label: 'XP EARNED', value: '+146', sub: 'Level 12 · 64%', color: t.goldText, edge: t.panelEdge, bar: '#ffd166', cls: 'nk-slide-3' },
        { label: 'STUDY TIME', value: '11:40', sub: 'Under the 12 min plan', color: t.textStrong, edge: t.panelEdge2, bar: '#ffd166', cls: 'nk-slide-4' },
      ],
      ups: [
        { word: 'Spelling', vi: 'Cách đánh vần', from: 'A', to: 'S', toColor: t.violetText, rim: t.tier.learning.rim, spin: '', glow: 'drop-shadow(0 0 14px rgb(155 107 255 / 0.55))' },
        { word: 'Immediate', vi: 'Ngay lập tức', from: 'A', to: 'S', toColor: t.violetText, rim: t.tier.learning.rim, spin: '', glow: 'drop-shadow(0 0 14px rgb(155 107 255 / 0.55))' },
        { word: 'Instant', vi: 'Khoảnh khắc', from: 'Bloom', to: 'Star', toColor: t.crimsonText, rim: t.tier.mastered.rim, spin: 'nk-rim-spin', glow: 'drop-shadow(0 0 18px rgb(255 42 77 / 0.8))' },
      ],
      nexts: [
        { title: 'REVIEW MISSES', sub: '1 card · 1 min' },
        { title: 'BONUS STEP', sub: 'Story · 4 min' },
        { title: 'DONE FOR TODAY', sub: 'Next lesson 07:30' },
      ],
    };
  }
}
</script>
</body>
</html>
