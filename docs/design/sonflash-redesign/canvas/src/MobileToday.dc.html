<!--#HEAD Mobile today-->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: {{t.pageBg}}; display: flex; flex-direction: column;">
<!--#AMBIENT-->
  <header style="position: relative; z-index: 3; height: 64px; flex-shrink: 0; padding: 0 20px; display: flex; align-items: center; gap: 10px;">
    <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: {{t.logoBg}}; box-shadow: {{t.logoShadow}}; display: flex; align-items: center; justify-content: center; color: {{t.logoText}}; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 18px;">S</span>
    <span style="font-family: Fraunces, Georgia, serif; font-size: 21px;">Son<span style="font-style: {{t.emStyle}}; color: {{t.emColor}};">Flash</span></span>
    <span style="margin-left: auto; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid {{t.warmLine}}; background: {{t.warmBg}}; color: {{t.warm}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5.5-1.5 8.2 0 1.4 1 2.5 2.3 2.5 1.5 0 2.4-1.2 2.2-3 2.3 1.7 3.5 4.3 3.5 6.8C18.5 20 15.6 22 12 22s-6.5-2.3-6.5-5.9c0-4.7 4.3-7 6.5-14.1z"></path></svg>12</span>
    <button aria-label="Account" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.avatarBg}}; color: {{t.avatarText}}; font-size: 12px; font-weight: 700;">KB</button>
  </header>

  <main style="position: relative; z-index: 2; flex-grow: 1; padding: 14px 20px 0; display: flex; flex-direction: column;">
    <p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: {{t.text2}};">Wednesday · 23 Sep</p>
    <h1 style="margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 42px; line-height: 1.02; letter-spacing: -0.03em; color: {{t.textStrong}};">12 words ready to <span style="font-style: {{t.emStyle}}; color: {{t.emColor}}; text-shadow: {{t.emGlow}};">remember.</span></h1>

    <div style="position: relative; margin: 26px auto 0; width: 250px; height: 300px;">
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: {{t.miniR}}px; background: {{t.ghostBg}}; border: 1px solid {{t.line}}; transform: translate3d(26px, 10px, 0) rotate(7deg);"></div>
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: {{t.miniR}}px; background: {{t.ghostBg}}; border: 1px solid {{t.line}}; transform: translate3d(-24px, 12px, 0) rotate(-6deg);"></div>
      <div style="position: absolute; inset: 0; box-sizing: border-box; border-radius: {{t.miniR}}px; overflow: hidden; display: flex; flex-direction: column; border: {{front.border}}; background: {{front.bg}}; box-shadow: {{front.shadow}};">
        <div style="height: 140px; flex-shrink: 0; margin: {{t.imgMarginSm}}; border-radius: {{t.imgRadius}}; overflow: hidden;">
          <img src="../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg" alt="Illustration for immediate" style="width: 100%; height: 100%; object-fit: cover; display: block; -webkit-mask-image: {{t.imgMask}}; mask-image: {{t.imgMask}};">
        </div>
        <div style="padding: 6px 18px 0;">
          <div style="font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text2}};">Due now</div>
          <div style="margin-top: 4px; font-family: Fraunces, Georgia, serif; font-weight: {{t.displayWeight}}; font-size: 36px; line-height: 1; letter-spacing: -0.02em; color: {{t.textStrong}};">Im<span style="font-style: {{t.emStyle}}; color: {{t.emColor}};">me</span>diate</div>
          <div style="margin-top: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.text2}};">/ɪˈmiːdiət/</div>
        </div>
      </div>
    </div>

    <button class="sf-press" style="margin-top: 32px; height: 58px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 16px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 10px;">Start review <span style="font-weight: 500; opacity: 0.7;">· 6 min</span></button>

    <div style="margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div style="padding: 14px 16px; border-radius: 16px; border: 1px solid {{t.line}}; background: {{t.surface}}; box-shadow: {{t.surfaceShadow}};">
        <div style="font-size: 12px; color: {{t.text2}};">Recall · 30 d</div>
        <div style="margin-top: 2px; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: {{t.displayWeight}}; color: {{t.textStrong}};">92%</div>
      </div>
      <div style="padding: 14px 16px; border-radius: 16px; border: 1px solid {{t.line}}; background: {{t.surface}}; box-shadow: {{t.surfaceShadow}};">
        <div style="font-size: 12px; color: {{t.text2}};">IELTS core</div>
        <div style="margin-top: 2px; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: {{t.displayWeight}}; color: {{t.textStrong}};">34<span style="font-size: 15px; color: {{t.text2}};"> / 120</span></div>
      </div>
    </div>
  </main>

  <nav aria-label="Main" style="position: relative; z-index: 3; flex-shrink: 0; margin: 0 14px 18px; height: 68px; border-radius: 22px; border: 1px solid {{t.line}}; background: {{t.tabBg}}; box-shadow: {{t.tabShadow}}; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
      <a href="#" aria-current="{{tb.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{tb.color}};">
        <span style="width: 44px; height: 28px; border-radius: 14px; background: {{tb.pill}}; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{tb.icon}}"></path></svg>
        </span>
        {{tb.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), miniR: dark ? 22 : 16, imgMarginSm: dark ? '0' : '9px 9px 0',
      ghostBg: dark ? '#0c1f28' : '#f7f2e7',
      tabBg: dark ? 'rgb(12 30 40 / 0.72)' : 'rgb(255 252 245 / 0.94)', tabShadow: dark ? '0 20px 40px -20px rgb(0 0 0 / 0.9)' : '0 12px 30px -16px rgb(60 40 20 / 0.45)' };
    const front = dark
      ? { border: '1.5px solid transparent', bg: t.cardBg + ' padding-box, ' + t.rimLearning + ' border-box', shadow: '0 30px 60px -24px rgb(0 0 0 / 0.9), 0 0 40px -12px rgb(40 211 244 / 0.5)' }
      : { border: '0', bg: t.cardBg, shadow: t.cardShadow };
    const icons = [
      'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      'M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z',
      'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',
      'M4 20V10M10 20V4M16 20v-7M22 20H2',
    ];
    return {
      t, front, grainId: 'mtoday-grain-' + (dark ? 'd' : 'l'),
      amb: { ax: -180, ay: -160, bx: 80, by: 300 },
      tabs: ['Today', 'Paths', 'Words', 'Progress'].map((label, i) => ({
        label, icon: icons[i], current: i === 0 ? 'page' : 'false',
        color: i === 0 ? (dark ? '#f1f6f9' : '#1d1a16') : t.text2,
        pill: i === 0 ? (dark ? 'rgb(40 211 244 / 0.16)' : 'rgb(180 70 26 / 0.12)') : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
