<!--#HEAD Extension popup-->
<div style="width: 380px; height: 640px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: {{t.pageBg}}; display: flex; flex-direction: column;">
<!--#AMBIENT-->
  <header style="position: relative; z-index: 2; height: 56px; flex-shrink: 0; padding: 0 16px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid {{t.navLine}};">
    <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: {{t.logoBg}}; box-shadow: {{t.logoShadow}}; display: flex; align-items: center; justify-content: center; color: {{t.logoText}}; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px;">S</span>
    <span style="font-family: Fraunces, Georgia, serif; font-size: 18px;">Son<span style="font-style: {{t.emStyle}}; color: {{t.emColor}};">Flash</span></span>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{t.text3}};">v1.6.3</span>
    <a href="#" aria-label="Cài đặt" style="margin-left: auto; width: 36px; height: 36px; border-radius: 50%; color: {{t.text2}}; display: flex; align-items: center; justify-content: center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
  </header>

  <div style="position: relative; z-index: 2; flex-grow: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <label style="display: block;">
      <span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: {{t.text2}};">Từ hoặc cụm từ<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 400; color: {{t.text3}};">9/80</span></span>
      <span style="margin-top: 6px; height: 46px; box-sizing: border-box; padding: 0 6px 0 14px; border-radius: 14px; border: 1px solid {{t.accentLine}}; background: {{t.inputBg}}; box-shadow: {{t.focusRing}}; display: flex; align-items: center; gap: 8px;">
        <input value="immediate" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{t.textStrong}}; font-family: Fraunces, Georgia, serif; font-size: 19px;">
        <button aria-label="Nghe phát âm" style="width: 36px; height: 36px; border-radius: 10px; border: 0; background: {{t.accentSoft}}; color: {{t.accentText}}; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
      </span>
    </label>

    <div style="display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px;">
      <button style="height: 58px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; box-shadow: {{t.secondaryShadow}}; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px; text-align: left;"><span style="font-size: 13.5px; font-weight: 650;">Dịch nhanh</span><span style="font-size: 11px; color: {{t.text3}};">Miễn phí · không lưu</span></button>
      <button style="height: 58px; border-radius: 14px; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 14px; text-align: left;"><span style="font-size: 13.5px; font-weight: 650;">Dịch + tạo flashcard</span><span style="font-size: 11px; opacity: 0.72;">1 AI request · tự lưu</span></button>
    </div>

    <div style="position: relative; box-sizing: border-box; border-radius: {{t.miniR}}px; overflow: hidden; border: {{card.border}}; background: {{card.bg}}; box-shadow: {{card.shadow}}; padding: 16px 18px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: {{t.okBg}}; color: {{t.okText}}; font-size: 11.5px; font-weight: 650; display: flex; align-items: center; gap: 5px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Đã lưu vào IELTS</span>
        <span style="margin-left: auto; font-size: 11.5px; color: {{t.text3}};">Ôn lần đầu: ngày mai</span>
      </div>
      <div style="margin-top: 12px; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 34px; line-height: 1; letter-spacing: -0.02em; color: {{t.textStrong}};">Im<span style="font-style: {{t.emStyle}}; color: {{t.emColor}}; text-shadow: {{t.emGlow}};">me</span>diate</div>
      <div style="margin-top: 6px; font-size: 12.5px; color: {{t.text2}};"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">/ɪˈmiːdiət/</span> · adjective</div>
      <div style="margin-top: 12px; font-family: Fraunces, Georgia, serif; font-size: 24px; color: {{t.accentText}};">ngay lập tức</div>
      <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: {{t.body}};"><span style="font-style: italic;">“…demanded an <span style="color: {{t.textStrong}}; font-weight: 600;">immediate</span> response from the council.”</span></p>
      <div style="margin-top: 12px; display: flex; gap: 6px;">
        <a href="#" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.line}}; color: {{t.text}}; font-size: 12.5px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">Mở thẻ</a>
        <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;">Deck: IELTS <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: {{t.text2}};">Tra cứu gần đây<button style="border: 0; background: none; padding: 0; font-size: 12px; color: {{t.text3}};">Xóa</button></div>
      <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
          <button style="height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text}}; font-family: Fraunces, Georgia, serif; font-size: 14px;">{{r}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <footer style="position: relative; z-index: 2; flex-shrink: 0; padding: 12px 16px 14px; border-top: 1px solid {{t.navLine}}; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: {{t.text2}};">
      <span><span style="font-family: 'Geist Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 5px; border: 1px solid {{t.line}};">Ctrl Shift L</span> dịch + thêm</span>
      <span><span style="font-family: 'Geist Mono', ui-monospace, monospace; padding: 2px 6px; border-radius: 5px; border: 1px solid {{t.line}};">Alt Shift L</span> chỉ dịch</span>
    </div>
    <a href="#" style="height: 42px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; font-size: 13.5px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">Mở thư viện SonFlash <span style="color: {{t.accentText}};">· 12 thẻ đến hạn</span></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":380,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), miniR: dark ? 20 : 14,
      focusRing: dark ? '0 0 0 4px rgb(40 211 244 / 0.12)' : '0 0 0 4px rgb(180 70 26 / 0.1)',
      okBg: dark ? 'rgb(117 208 121 / 0.14)' : 'rgb(51 115 68 / 0.1)', okText: dark ? '#9be09e' : '#2c6a3d' };
    const card = dark
      ? { border: '1.5px solid transparent', bg: 'radial-gradient(ellipse 80% 60% at 100% 0%, rgb(150 108 215 / 0.22), transparent 70%) padding-box, ' + t.cardBg + ' padding-box, ' + t.rimLearning + ' border-box', shadow: '0 20px 40px -20px rgb(0 0 0 / 0.9), 0 0 36px -14px rgb(40 211 244 / 0.5)' }
      : { border: '0', bg: t.cardBg, shadow: 'inset 0 1px 0 #ffffff, inset 0 0 0 1px rgb(29 26 22 / 0.06), 0 12px 24px -16px rgb(60 40 20 / 0.4)' };
    return {
      t, card, grainId: 'popup-grain-' + (dark ? 'd' : 'l'),
      amb: { ax: -260, ay: -300, bx: 120, by: 380 },
      recent: ['permanent', 'recharge', 'warden'],
    };
  }
}
</script>
</body>
</html>
