<!--#HEAD Edit card-->
<!--#DLGOPEN-->
    <header style="flex-shrink: 0; padding: 22px 22px 18px 26px; display: flex; align-items: flex-start; gap: 14px; border-bottom: 1px solid {{t.line}};">
      <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text3}};">IELTS · added 12 Sep · reviewed 4 times</div>
      <h2 id="dlg-title" style="margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; color: {{t.textStrong}};">Edit card</h2>
      </div>
      <button aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div style="flex-grow: 1; min-height: 0; padding: 16px 26px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px;">
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Word</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-size: 18px;">immediate</span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Part of speech</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px;">adjective<span style="margin-left: auto; color: {{t.text3}};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></span></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Meaning (Vietnamese)</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; border-color: {{t.accentLine}}; box-shadow: 0 0 0 4px {{t.accentSoft}};">ngay lập tức<span style="width: 1.5px; height: 18px; margin-left: -6px; background: {{t.accent}};"></span></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">IPA</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13.5px;">/ɪˈmiːdiət/</span></label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Example</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; font-size: 13.5px;">The council demanded an immediate response.</span></label>
      <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Example translation</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: {{t.body}};">Hội đồng yêu cầu phản hồi ngay lập tức.</span></label>
      <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Memory hook</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; height: 52px; align-items: flex-start; padding-top: 8px; font-size: 13.5px; line-height: 1.45; color: {{t.body}};">im + media: không có gì ở giữa → xảy ra ngay, không qua trung gian.</span></label>
      <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px;">
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Image URL</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; padding-left: 5px; font-size: 13px; color: {{t.text2}};"><img src="../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg" alt="" style="width: 32px; height: 32px; border-radius: 7px; object-fit: cover;"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">images.sonflash.app/w/immediate.jpg</span></span></label>
        <label style="display: flex; flex-direction: column; gap: 5px; min-width: 0;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Deck</span><span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px;">IELTS<span style="margin-left: auto; color: {{t.text3}};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></span></span></label>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Difficulty</span>
        <div role="radiogroup" aria-label="Difficulty" style="display: flex; gap: 4px; padding: 3px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.chipBg}};">
          <sc-for list="{{diff}}" as="d" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{d.on}}" style="height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: {{d.bg}}; color: {{d.color}}; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{d.dot}};"></span>{{d.label}}</button>
          </sc-for>
        </div>
        <button aria-pressed="true" style="margin-left: auto; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.warmLine}}; background: {{t.warmBg}}; color: {{t.warm}}; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Starred</button>
      </div>
    </div>
    <footer style="flex-shrink: 0; padding: 16px 22px 20px 26px; border-top: 1px solid {{t.line}}; display: flex; align-items: center; gap: 10px;">
      <button style="height: 44px; padding: 0 4px; border: 0; background: none; color: {{t.danger}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>Delete card</button>
      <button style="margin-left: auto; height: 44px; padding: 0 18px; border-radius: {{t.btnRadius}}; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; box-shadow: {{t.secondaryShadow}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">Cancel</button>
      <button class="sf-press" style="height: 44px; padding: 0 20px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; cursor: pointer;">Save changes</button>
    </footer>
<!--#DLGCLOSE-->
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), fr: dark ? 14 : 10 };
    const diff = [['Easy', t.good], ['Medium', t.accent], ['Hard', t.hard]].map(([label, dot]) => {
      const on = label === 'Medium';
      return { label, dot, on: String(on), bg: on ? (dark ? 'rgb(255 255 255 / 0.1)' : '#ffffff') : 'transparent', color: on ? t.textStrong : t.text2 };
    });
    return {
      t, dw: 620, grainId: 'edit-card-grain-' + (dark ? 'd' : 'l'), amb: { ax: -180, ay: -220, bx: 380, by: 460 },
      diff,
    };
  }
}
</script>
</body>
</html>
