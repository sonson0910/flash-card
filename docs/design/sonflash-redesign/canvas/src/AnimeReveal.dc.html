<!--#AHEAD Crystal Star ceremony-->
<div style="width: 720px; height: 780px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: {{t.fBody}}; background: {{t.pageBg}};">

  <div aria-hidden="true" class="nk-beam" style="position: absolute; left: 72%; top: -20%; width: 30px; height: 140%; transform: rotate(-18deg); background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.35), transparent); animation-delay: -5s;"></div>

<!--#WINGS-->
  </div>

<!--#WINGS-->
  </div>

  <div class="nk-float" style="position: absolute; left: 6px; bottom: 0; width: 170px; height: 190px; z-index: 4;">
<!--#MASCOT $-->
  </div>

  <div role="dialog" aria-modal="true" aria-labelledby="rv-title" style="position: relative; z-index: 3; height: 100%; box-sizing: border-box; padding: 40px 60px 44px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div class="nk-banner" style="height: 34px; padding: 0 26px; transform: skewX(-16deg); background: {{t.primaryBg}}; display: flex; align-items: center; filter: drop-shadow(0 0 16px rgb(255 42 77 / 0.8));"><span style="transform: skewX(16deg); font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 15px; letter-spacing: 0.2em; color: #ffffff;">{{kicker}}</span></div>

    <sc-if value="{{isTier}}" hint-placeholder-val="{{true}}">
      <div class="nk-pop" style="position: relative; margin-top: 30px; width: 250px; height: 330px; filter: drop-shadow(0 0 34px rgb(255 42 77 / 0.9));">
        <div style="position: absolute; inset: 0; clip-path: {{t.chamfer}}; overflow: hidden;"><div class="nk-rim-spin" style="position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; background: {{t.tier.mastered.rim}};"></div></div>
        <div style="position: absolute; inset: 4px; clip-path: {{t.chamfer}}; overflow: hidden; background: {{t.cardFront}}; display: flex; flex-direction: column;">
          <div style="position: relative; height: 150px; overflow: hidden; clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);"><img src="../assets/blob/4e8348b18995828a6faaee433ba17ccd.jpg" alt="Illustration for Instant" style="width: 100%; height: 100%; object-fit: cover; display: block;"><div aria-hidden="true" style="position: absolute; inset: 0; mix-blend-mode: color-dodge; opacity: 0.45; background: repeating-linear-gradient(115deg, rgb(255 143 182 / 0.6) 0%, rgb(255 209 102 / 0.6) 8%, rgb(94 242 255 / 0.6) 16%, rgb(155 107 255 / 0.6) 24%, rgb(255 143 182 / 0.6) 32%);"></div></div>
          <div style="padding: 6px 18px 0; text-align: left;">
            <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; color: {{t.crimsonText}};">NOUN // TIME</div>
            <div style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 40px; line-height: 1.05; color: {{t.textStrong}};"><span style="background: linear-gradient(180deg, #ff8fa3, #ff2a4d 55%, #b30f33); -webkit-background-clip: text; background-clip: text; color: transparent;">In</span>stant</div>
            <div style="font-size: 14px; font-weight: 700; color: {{t.text2}};">Khoảnh khắc</div>
          </div>
          <div style="margin-top: auto; padding: 0 16px 16px; display: flex; align-items: center; gap: 10px;">
            <span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 22px; color: {{t.text3}}; text-decoration: line-through;">S</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text2}}" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span style="height: 34px; padding: 0 14px; clip-path: {{t.chamferSm}}; background: {{t.tier.mastered.rim}}; display: flex; align-items: center; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 22px; color: #ffffff; text-shadow: 0 2px 0 #7a0820;">STAR</span>
          </div>
        </div>
        <span aria-hidden="true" class="nk-flare" style="position: absolute; right: -50px; top: -50px; width: 130px; height: 130px;"><span style="position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, transparent, #ffffff, transparent);"></span><span style="position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: linear-gradient(180deg, transparent, #ffffff, transparent);"></span><span style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 16px 6px rgb(255 84 112 / 0.8);"></span></span>
      </div>
    </sc-if>

    <sc-if value="{{isStreak}}" hint-placeholder-val="{{false}}">
      <div class="nk-pop" style="position: relative; margin-top: 30px; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center;">
        <svg aria-hidden="true" width="230" height="270" viewBox="0 0 24 28" style="position: absolute; filter: drop-shadow(0 0 30px rgb(255 42 77 / 0.9));"><path d="M12 1c1.3 4.2-1.8 6.6-1.8 9.8 0 1.7 1.2 3 2.8 3 1.8 0 2.9-1.4 2.6-3.6 2.8 2 4.2 5.1 4.2 8.1C19.8 23.4 16.3 27 12 27s-7.8-2.9-7.8-7.3C4.2 14.1 9.4 11.4 12 1z" fill="url(#rv-flame-grad)"></path><defs><linearGradient id="rv-flame-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"></stop><stop offset="0.45" stop-color="#ff5470"></stop><stop offset="1" stop-color="#7a0820"></stop></linearGradient></defs></svg>
        <div style="position: relative; margin-top: 60px; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 104px; line-height: 1; background: linear-gradient(180deg, #ffffff 0%, #fff3c4 50%, #ffd166 56%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #7a0820);">30</div>
        <div style="position: absolute; right: 14px; top: 20px; width: 70px; height: 70px; filter: drop-shadow(0 0 12px rgb(255 42 77 / 0.9));">
<!--#STAR5-->
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isLevel}}" hint-placeholder-val="{{false}}">
      <div class="nk-pop" style="position: relative; margin-top: 30px; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center;">
        <div style="position: absolute; inset: 0; filter: drop-shadow(0 0 34px rgb(255 42 77 / 0.9));">
<!--#STAR5-->
        </div>
        <div style="position: relative; margin-top: 26px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 18px; letter-spacing: 0.16em; color: #ffffff;">LV</span>
          <span style="font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 92px; background: linear-gradient(180deg, #ffffff 0%, #fff3c4 50%, #ffd166 56%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #7a0820);">13</span>
        </div>
      </div>
    </sc-if>

    <h2 id="rv-title" class="nk-pop-2" style="margin: 22px 0 0; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 50px; line-height: 1; letter-spacing: 0.02em; background: linear-gradient(180deg, #ffffff 0%, #ffe3ea 46%, #ff8fa3 54%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #7a0820) drop-shadow(0 0 20px rgb(255 42 77 / 0.8));">{{title}}</h2>
    <p class="nk-rise-3" style="margin: 12px 0 0; max-width: 440px; font-size: 15.5px; line-height: 1.55; font-weight: 700; color: {{bodyColor}}; text-shadow: {{bodyShadow}};">{{body}}</p>

    <div class="nk-rise-3" style="margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <span style="height: 32px; padding: 0 14px; clip-path: {{t.chamferSm}}; background: {{c.bg}}; color: {{c.color}}; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 13.5px; letter-spacing: 0.04em; display: flex; align-items: center;">{{c.label}}</span>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; gap: 12px;">
      <button class="nk-lift" style="height: 50px; padding: 0 24px; border: 0; clip-path: {{t.chamferSm}}; background: {{secBg}}; box-shadow: inset 0 0 0 1px {{secLine}}; color: {{secColor}}; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; cursor: pointer;">{{secondary}}</button>
      <button class="nk-lift" style="height: 50px; padding: 0 32px; border: 0; clip-path: {{t.chamfer}}; background: {{t.primaryBg}}; color: #ffffff; font-family: {{t.fDisplay}}; font-style: italic; font-weight: 900; font-size: 18px; letter-spacing: 0.08em; cursor: pointer; filter: drop-shadow(0 0 16px rgb(255 42 77 / 0.8));">{{primary}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["tierup","streak","levelup"],"default":"tierup"},"$preview":{"width":720,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
//#ATOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = nkTokens(dark);
    const state = this.props.state ?? 'tierup';
    const gold = { bg: 'linear-gradient(180deg, #fff0b8, #ffd166)', color: '#4a2a00' };
    const holo = { bg: 'linear-gradient(180deg, #9ff9ff, #1aa7c9)', color: '#031820' };
    const red = { bg: t.primaryBg, color: '#ffffff' };
    const copy = {
      tierup: { kicker: 'GLOW UP', title: 'MASTERED!', body: '"Instant" became a Star after 6 correct reviews in a row. It will come back in 21 days to stay sharp.', chips: [{ ...gold, label: '+25 XP' }, { ...red, label: 'Star · 14 in deck' }, { ...holo, label: 'Next review · 21 days' }], primary: 'CONTINUE', secondary: 'SHARE CARD' },
      streak: { kicker: 'STREAK MILESTONE', title: '30-DAY STREAK', body: 'A full month of study. You earned 1 streak freeze, so one missed day will not break the chain. You now hold 2.', chips: [{ ...holo, label: '+1 streak freeze' }, { ...gold, label: '+100 XP' }, { ...red, label: 'Badge · Web Wanderer' }], primary: 'KEEP GOING', secondary: 'SHARE' },
      levelup: { kicker: 'LEVEL UP', title: 'LV 12 → 13', body: 'New profile frame unlocked. Your daily plan now adds 2 more new words when you are ahead of schedule.', chips: [{ ...red, label: 'Frame · Crimson Wing' }, { ...gold, label: '+1 hint token' }, { ...holo, label: 'Title · Word Collector' }], primary: 'USE FRAME', secondary: 'LATER' },
    }[state];
    return {
      t, bg: { wings: false },
      lumiSrc: t.lumi[state === 'tierup' ? 'proud' : 'happy'],
      bodyColor: dark ? '#ffffff' : t.textStrong, bodyShadow: dark ? '0 1px 8px rgb(0 0 0 / 0.5)' : '0 0 12px rgb(255 255 255 / 0.9)',
      secBg: dark ? 'rgb(255 255 255 / 0.12)' : '#ffffff', secLine: dark ? 'rgb(255 255 255 / 0.4)' : t.lineStrong, secColor: dark ? '#ffffff' : t.textStrong,
      isTier: state === 'tierup', isStreak: state === 'streak', isLevel: state === 'levelup',
      ...copy,
    };
  }
}
</script>
</body>
