<!--#HEAD New deck-->
<!--#DLGOPEN-->
    <header style="flex-shrink: 0; padding: 22px 22px 18px 26px; display: flex; align-items: flex-start; gap: 14px; border-bottom: 1px solid {{t.line}};">
      <div style="flex-grow: 1; min-width: 0;">
      <h2 id="dlg-title" style="margin: 0 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; color: {{t.textStrong}};">New deck</h2>
      <p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: {{t.text2}};">Group words by exam, trip, book — anything you like.</p>
      </div>
      <button aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div style="flex-grow: 1; min-height: 0; padding: 20px 26px 22px; display: flex; flex-direction: column; gap: 18px;">
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Deck name</span>
        <span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; height: 48px; border-color: {{t.dangerLine}}; box-shadow: 0 0 0 4px {{t.dangerBg}};"><input aria-invalid="true" aria-describedby="deck-err" value="IELTS" placeholder="IELTS, Travel…" style="width: 100%; border: 0; outline: none; background: transparent; color: {{t.textStrong}}; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-size: 19px;"></span>
        <span id="deck-err" style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{t.danger}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>A deck with this name already exists</span>
      </label>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-size: 12.5px; color: {{t.text3}}; margin-right: 2px;">Try</span>
        <sc-for list="{{suggest}}" as="s" hint-placeholder-count="3"><button style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text}}; font-size: 13px; cursor: pointer;">{{s}}</button></sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Cover</span>
        <div role="radiogroup" aria-label="Deck cover" style="display: flex; gap: 10px;">
          <sc-for list="{{covers}}" as="c" hint-placeholder-count="5">
            <button role="radio" aria-checked="{{c.on}}" aria-label="{{c.name}}" style="width: 72px; height: 90px; padding: 0; border-radius: 12px; border: 0; background: {{c.bg}}; box-shadow: {{c.ring}}; display: flex; align-items: flex-end; justify-content: flex-start; overflow: hidden; cursor: pointer;"><span style="padding: 0 0 6px 9px; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-style: italic; font-size: 48px; line-height: 0.8; color: {{c.text}};">I</span></button>
          </sc-for>
        </div>
      </div>
    </div>
    <footer style="flex-shrink: 0; padding: 16px 22px 20px 26px; border-top: 1px solid {{t.line}}; display: flex; align-items: center; gap: 10px;">
      <button style="margin-left: auto; height: 44px; padding: 0 18px; border-radius: {{t.btnRadius}}; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; box-shadow: {{t.secondaryShadow}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">Cancel</button>
      <button disabled aria-disabled="true" style="height: 44px; padding: 0 20px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; cursor: pointer; opacity: 0.4; box-shadow: none; cursor: not-allowed;">Create deck</button>
    </footer>
<!--#DLGCLOSE-->
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), fr: dark ? 14 : 10 };
    const C = dark
      ? [['Aurora', 'linear-gradient(150deg, #7ee6fa, #28d3f4 45%, #966cd7)', '#04141c'], ['Violet', 'linear-gradient(160deg, #3a2a63, #1d1535)', '#c9b3f0'], ['Amber', 'linear-gradient(160deg, #5a3b0e, #2b1d08)', '#f5ae39'], ['Slate', 'linear-gradient(160deg, #1d3a48, #0f2430)', '#e5ecf1'], ['Moss', 'linear-gradient(160deg, #1f4a2c, #10261a)', '#9be09e']]
      : [['Terracotta', '#b4461a', '#fbf6ec'], ['Moss', '#337344', '#f3d58a'], ['Gold', '#d9b76a', '#1d1a16'], ['Ink', '#1d1a16', '#fbf6ec'], ['Linen', '#e8dfcf', '#97400d']];
    const covers = C.map(([name, bg, text], i) => ({ name, bg, text, on: String(i === 0),
      ring: i === 0 ? '0 0 0 2px ' + (dark ? '#06161f' : '#fffcf5') + ', 0 0 0 4px ' + t.accent : 'inset 0 0 0 1px ' + t.line }));
    return {
      t, dw: 520, grainId: 'new-deck-grain-' + (dark ? 'd' : 'l'), amb: { ax: -180, ay: -220, bx: 380, by: 460 },
      covers, suggest: ['IELTS Writing', 'Travel', 'TOEIC 600'],
    };
  }
}
</script>
</body>
</html>
