<!--#HEAD Clear library-->
<!--#DLGOPEN-->
    <header style="flex-shrink: 0; padding: 22px 22px 18px 26px; display: flex; align-items: flex-start; gap: 14px; border-bottom: 1px solid {{t.line}};">
      <span aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: {{t.dangerSolid}}; color: {{t.dangerSolidText}}; box-shadow: 0 10px 30px -10px {{t.dangerSolid}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></span>
      <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text3}};">Danger zone</div>
      <h2 id="dlg-title" style="margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; color: {{t.textStrong}};">Clear the entire library?</h2>
      </div>
      <button aria-label="Close" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div style="flex-grow: 1; min-height: 0; padding: 20px 26px 22px; display: flex; flex-direction: column; gap: 16px;">
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: {{t.body}};">This permanently deletes every card, deck and review history on all your synced devices. <span style="font-weight: 650; color: {{t.danger}};">It can’t be undone.</span></p>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); border-radius: {{t.fr}}px; border: 1px solid {{t.dangerLine}}; background: {{t.dangerBg}};">
        <div style="padding: 12px 16px; border-right: 1px solid {{t.dangerLine}};"><div style="font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-size: 28px; color: {{t.textStrong}};">1,228</div><div style="font-size: 12px; color: {{t.text2}};">cards</div></div>
        <div style="padding: 12px 16px; border-right: 1px solid {{t.dangerLine}};"><div style="font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-size: 28px; color: {{t.textStrong}};">5</div><div style="font-size: 12px; color: {{t.text2}};">decks</div></div>
        <div style="padding: 12px 16px;"><div style="font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-size: 28px; color: {{t.textStrong}};">312</div><div style="font-size: 12px; color: {{t.text2}};">mastered words</div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.chipBg}};">
        <span style="font-size: 13.5px; line-height: 1.4; color: {{t.body}};">Keep a copy first — export everything as CSV.</span>
        <button style="margin-left: auto; flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Export CSV</button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Type <span style="font-family: 'Geist Mono', ui-monospace, monospace; color: {{t.danger}};">DELETE</span> to confirm</span>
        <span style="box-sizing: border-box; height: 42px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; color: {{t.textStrong}}; font-size: 14px; display: flex; align-items: center; gap: 8px; height: 48px; border-color: {{t.dangerLine}};"><input value="DELETE" aria-label="Type DELETE to confirm" style="width: 100%; border: 0; outline: none; background: transparent; color: {{t.textStrong}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; letter-spacing: 0.12em;"><span style="color: {{t.danger}};"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span>
      </label>
    </div>
    <footer style="flex-shrink: 0; padding: 16px 22px 20px 26px; border-top: 1px solid {{t.line}}; display: flex; align-items: center; gap: 10px;">
      <button style="margin-left: auto; height: 44px; padding: 0 18px; border-radius: {{t.btnRadius}}; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; box-shadow: {{t.secondaryShadow}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">Keep library</button>
      <button class="sf-press" style="height: 44px; padding: 0 20px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.dangerSolid}}; color: {{t.dangerSolidText}}; box-shadow: 0 14px 30px -16px {{t.dangerSolid}}; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; cursor: pointer;">Delete everything</button>
    </footer>
<!--#DLGCLOSE-->
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), fr: dark ? 14 : 10 };
    return {
      t, dw: 540, grainId: 'clear-library-grain-' + (dark ? 'd' : 'l'), amb: { ax: -180, ay: -220, bx: 380, by: 460 },
    };
  }
}
</script>
</body>
</html>
