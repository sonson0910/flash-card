<!--#HEAD Edit side sheet-->
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: {{t.pageBg}};">
<!--#AMBIENT-->
  <header style="position: relative; z-index: 3; height: 72px; padding: 0 40px; display: flex; align-items: center; gap: 18px; opacity: 0.6;">
    <button aria-label="End session" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <span style="font-size: 13px; font-weight: 600; color: {{t.text2}};">Review · IELTS</span>
    <div style="width: 360px; height: 6px; border-radius: 6px; background: {{t.track}}; overflow: hidden;"><div style="width: 40%; height: 100%; border-radius: 6px; background: {{bar}};"></div></div>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.text2}};">8 / 20</span>
  </header>

  <main style="position: absolute; left: 0; top: 72px; right: 440px; bottom: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 60px;">
    <span style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid {{t.infoLine}}; background: {{t.infoBg}}; color: {{t.info}}; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>Session paused · timer stopped</span>
    <div style="margin-top: 22px; width: 400px; height: 500px; box-sizing: border-box; border-radius: {{t.cardRadius}}px; overflow: hidden; border: {{card.border}}; background: {{card.bg}}; box-shadow: {{card.shadow}}; display: flex; flex-direction: column; opacity: 0.92;">
      <div style="height: 220px; flex-shrink: 0; margin: {{t.imgMargin}}; border-radius: {{t.imgRadius}}; overflow: hidden;"><img src="../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg" alt="Illustration for immediate" style="width: 100%; height: 100%; object-fit: cover; display: block; -webkit-mask-image: {{t.imgMask}}; mask-image: {{t.imgMask}};"></div>
      <div style="padding: 14px 28px 0;">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text2}};">Adjective · editing</div>
        <div style="margin-top: 6px; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 54px; line-height: 1; letter-spacing: -0.03em; color: {{t.textStrong}};">Im<span style="font-style: {{t.emStyle}}; color: {{t.emColor}}; text-shadow: {{t.emGlow}};">me</span>diate</div>
        <div style="margin-top: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: {{t.text2}};">/ɪˈmiːdiət/</div>
        <div style="margin-top: 18px; font-family: Fraunces, Georgia, serif; font-size: 24px; color: {{t.accentText}};">ngay lập tức<span style="margin-left: 8px; padding: 2px 7px; border-radius: 6px; background: {{t.warnBg}}; border: 1px solid {{t.warnLine}}; font-family: Geist, system-ui, sans-serif; font-size: 11px; font-weight: 650; color: {{t.warn}}; vertical-align: 4px;">unsaved</span></div>
      </div>
    </div>
    <div style="margin-top: 26px; display: flex; gap: 10px; opacity: 0.35;" aria-hidden="true">
      <sc-for list="{{grades}}" as="g" hint-placeholder-count="4"><span style="width: 100px; height: 52px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.chipBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: {{g.color}};">{{g.label}}<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 400; color: {{t.text3}};">{{g.key}}</span></span></sc-for>
    </div>
  </main>

  <aside role="dialog" aria-modal="false" aria-labelledby="sheet-title" class="sf-pop" style="position: absolute; z-index: 4; top: 0; right: 0; bottom: 0; width: 440px; box-sizing: border-box; border-left: {{t.dlgBorder}}; background: {{t.dlgBg}}; box-shadow: {{sheetShadow}}; display: flex; flex-direction: column; transform-origin: 100% 50%;">
    <header style="flex-shrink: 0; padding: 22px 22px 16px 26px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid {{t.line}};">
      <div style="flex-grow: 1;">
        <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.text3}};">Card 8 of 20</div>
        <h2 id="sheet-title" style="margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; color: {{t.textStrong}};">Edit card</h2>
      </div>
      <button aria-label="Close" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div style="flex-grow: 1; min-height: 0; padding: 18px 26px; display: flex; flex-direction: column; gap: 14px;">
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Word</span>
        <span style="box-sizing: border-box; height: 46px; padding: 0 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; display: flex; align-items: center; gap: 10px;"><span style="flex-grow: 1; font-family: Fraunces, Georgia, serif; font-size: 19px; color: {{t.textStrong}};">immediate</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.text3}};">/ɪˈmiːdiət/</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Meaning</span>
        <span style="box-sizing: border-box; min-height: 74px; padding: 11px 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.accentLine}}; box-shadow: 0 0 0 4px {{t.accentSoft}}; background: {{t.inputBg}}; font-size: 14px; line-height: 1.5; color: {{t.textStrong}};">ngay lập tức; xảy ra không chậm trễ<span class="sf-wave" aria-hidden="true" style="display: inline-block; width: 2px; height: 16px; margin-left: 1px; vertical-align: -3px; background: {{bar}};"></span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Example</span>
        <span style="box-sizing: border-box; padding: 11px 14px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; font-size: 13.5px; line-height: 1.5; font-style: italic; color: {{t.body}};">“The council demanded an immediate response.”</span>
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Image</span>
        <div style="display: flex; gap: 12px; align-items: center;">
          <img src="../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg" alt="Current card image" style="width: 96px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid {{t.line}};">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"></path></svg>New image with AI</button>
            <button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: {{t.text2}}; font-size: 12.5px; font-weight: 600; text-align: left;">Upload · Remove</button>
          </div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Deck</span><span style="box-sizing: border-box; height: 42px; padding: 0 12px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; font-size: 14px; color: {{t.textStrong}}; display: flex; align-items: center; justify-content: space-between;">IELTS<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></span></label>
        <label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 600; color: {{t.text2}};">Tags</span><span style="box-sizing: border-box; height: 42px; padding: 0 8px; border-radius: {{t.fr}}px; border: 1px solid {{t.line}}; background: {{t.inputBg}}; display: flex; align-items: center; gap: 5px;"><span style="height: 24px; padding: 0 8px; border-radius: 999px; background: {{t.chipBg}}; border: 1px solid {{t.line}}; font-size: 11.5px; display: flex; align-items: center;">news</span><span style="height: 24px; padding: 0 8px; border-radius: 999px; background: {{t.chipBg}}; border: 1px solid {{t.line}}; font-size: 11.5px; display: flex; align-items: center;">B2</span></span></label>
      </div>
      <div style="padding: 10px 12px; border-radius: 12px; border: 1px solid {{t.okLine}}; background: {{t.okBg}}; font-size: 12.5px; line-height: 1.45; color: {{t.text}}; display: flex; gap: 8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.ok}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Your review history is kept. Changes show on this card right away.</div>
    </div>
    <footer style="flex-shrink: 0; padding: 16px 22px 20px 26px; border-top: 1px solid {{t.line}}; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 12px; color: {{t.text3}};"><span style="font-family: 'Geist Mono', ui-monospace, monospace; padding: 1px 5px; border-radius: 5px; border: 1px solid {{t.line}};">Esc</span> back to card</span>
      <button style="margin-left: auto; height: 44px; padding: 0 16px; border-radius: {{t.btnRadius}}; border: 1px solid {{t.line}}; background: {{t.secondaryBg}}; color: {{t.text}}; font-size: 14px; font-weight: 600;">Discard</button>
      <button class="sf-press" style="height: 44px; padding: 0 18px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px;">Save &amp; resume <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: {{t.primaryKbdBg}};">⌘↵</span></button>
    </footer>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
//#TOKENS
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = { ...sfTokens(dark), fr: dark ? 14 : 10 };
    return {
      t, grainId: 'edit-grain-' + (dark ? 'd' : 'l'), amb: { ax: -120, ay: -200, bx: 520, by: 480 },
      bar: dark ? '#28d3f4' : '#b4461a',
      card: dark
        ? { border: '1.5px solid transparent', bg: t.cardBg + ' padding-box, ' + t.rimLearning + ' border-box', shadow: '0 30px 70px -30px rgb(0 0 0 / 0.9), 0 0 60px -24px rgb(40 211 244 / 0.45)' }
        : { border: '0', bg: t.cardBg, shadow: t.cardShadow },
      sheetShadow: dark ? '-40px 0 90px -30px rgb(0 0 0 / 0.9), inset 1px 0 0 rgb(255 255 255 / 0.04)' : '-30px 0 60px -30px rgb(60 40 20 / 0.45)',
      grades: [
        { label: 'Again', key: '1', color: t.again }, { label: 'Hard', key: '2', color: t.hard },
        { label: 'Good', key: '3', color: t.good }, { label: 'Easy', key: '4', color: t.accentText },
      ],
    };
  }
}
</script>
</body>
</html>
