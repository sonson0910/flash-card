<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flashcard states — dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071014}
@keyframes sf-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
</helmet>
<div style="width: 2140px; height: 760px; box-sizing: border-box; padding: 70px 60px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 60px; background: radial-gradient(circle at 10% -10%, rgb(8 145 178 / 0.16), transparent 34rem), radial-gradient(circle at 90% 0%, rgb(14 116 144 / 0.12), transparent 36rem), #071014;">
  <div style="position: relative; width: 460px; height: 620px;">
    <div aria-hidden="true" style="position: absolute; inset: -18px; border-radius: 48px; filter: blur(26px); background: radial-gradient(ellipse at 50% 38%, rgba(6, 182, 212, 0.75) 0%, rgba(14, 165, 233, 0.45) 45%, rgba(99, 102, 241, 0.2) 70%, transparent 85%); opacity: 0.35;"></div>
    <div style="position: relative; transform: perspective(1600px) rotateX(-2deg) rotateY(-3deg);">
      <dc-import name="FlashFront" theme="dark" tier="new" hover="{{yes}}" mx="{{spotX}}" my="{{spotY}}" hint-size="460px,620px"></dc-import>
    </div>
  </div>
  <dc-import name="FlashBack" theme="dark" tier="new" starred="{{yes}}" hint-size="460px,620px"></dc-import>
  <dc-import name="FlashFront" theme="dark" tier="learning" blind="{{yes}}" starred="{{yes}}" playing="{{yes}}" card="{{immediate}}" hint-size="460px,620px"></dc-import>
  <div style="position: relative; width: 460px; height: 620px;">
    <div aria-hidden="true" style="position: absolute; inset: -18px; border-radius: 48px; filter: blur(26px); background: radial-gradient(ellipse at 50% 38%, rgba(251, 191, 36, 0.7) 0%, rgba(245, 158, 11, 0.4) 45%, rgba(6, 182, 212, 0.2) 70%, transparent 85%); opacity: 0.3;"></div>
    <div style="position: relative;">
      <dc-import name="FlashFront" theme="dark" tier="mastered" hover="{{yes}}" mx="{{foilX}}" my="{{spotY}}" card="{{instant}}" hint-size="460px,620px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2140,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, spotX: 28, spotY: 30, foilX: 45,
      immediate: { word: 'Immediate', pos: 'Adjective', category: 'Time and action', ipa: '/ɪˈmiːdiət/', pre: 'im·', stressed: 'me', rest: '·di·ate', definition: 'Happening or done without delay; acting or occurring at once.', image: '../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg' },
      instant: { word: 'Instant', pos: 'Noun', category: 'Time', ipa: '/ˈɪnstənt/', pre: '', stressed: 'in', rest: '·stant', definition: 'A very short period of time; a precise moment.', image: '../assets/blob/4e8348b18995828a6faaee433ba17ccd.jpg' },
    };
  }
}
</script>
</body>
</html>
