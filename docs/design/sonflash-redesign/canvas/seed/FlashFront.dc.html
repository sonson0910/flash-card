<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flashcard — English side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 460px; height: 620px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 32px; border: 1.5px solid transparent; background: linear-gradient({{t.bg}}, {{t.bg}}) padding-box, {{rim}} border-box; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; box-shadow: {{shadow}};">

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(circle at {{mx}}% {{my}}%, {{t.spot}} 0%, transparent 62%); opacity: {{spotOpacity}}; transition: opacity 200ms ease;"></div>
  <sc-if value="{{mastered}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 31; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(115deg, transparent 28%, rgb(255 226 150 / 0.2) 42%, rgb(150 240 255 / 0.16) 52%, rgb(255 170 230 / 0.12) 60%, transparent 74%); background-size: 260% 100%; background-position: {{foilPos}}% 0; transition: background-position 300ms ease-out;"></div>
  </sc-if>

  <div style="position: relative; height: 268px; flex-shrink: 0; overflow: hidden;">
    <img src="{{card.image}}" alt="Illustration for {{card.word}}" style="width: 100%; height: 100%; object-fit: cover; display: block; transform: scale({{imgScale}}); filter: {{imgFilter}}; transition: filter 500ms ease, transform 500ms ease;">
    <div aria-hidden="true" style="position: absolute; inset: auto 0 0 0; height: 190px; background: linear-gradient(to top, {{t.bg}} 8%, {{t.fadeMid}} 50%, transparent 100%);"></div>
    <sc-if value="{{blind}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; inset: 0 0 60px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #ffffff; font-size: 14px; font-weight: 600;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.2M6.3 6.3C3.8 8 2.5 12 2.5 12S6 19 12 19c1.8 0 3.4-.5 4.7-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        Image hint hidden
      </div>
    </sc-if>
    <div style="position: absolute; top: 18px; left: 18px; right: 18px; display: flex; align-items: center; gap: 8px;">
      <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: rgb(6 14 18 / 0.55); border: 1px solid rgb(255 255 255 / 0.2); color: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center;">{{card.category}}</span>
      <button onClick="{{onBlind}}" aria-label="Hide image hint" style="margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{blindBorder}}; background: {{blindBg}}; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button onClick="{{onStar}}" aria-label="Star this word" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{starBorder}}; background: {{starBg}}; color: {{starColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <span class="{{starAnim}}" style="display: inline-flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{starFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></span>
      </button>
    </div>
  </div>

  <div style="position: relative; z-index: 2; flex-grow: 1; display: flex; flex-direction: column; padding: 0 30px; margin-top: -44px;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: {{t.muted}};">
      <span>{{card.pos}}</span>
      <span aria-hidden="true" style="width: 3px; height: 3px; border-radius: 50%; background: {{t.muted}};"></span>
      <span style="display: inline-flex; align-items: center; gap: 6px; color: {{tierColor}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{tierColor}}; box-shadow: 0 0 8px {{tierColor}};"></span>{{tierLabel}}</span>
    </div>
    <h2 style="margin: 4px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.02; letter-spacing: -0.015em; background: {{t.wordGradient}}; -webkit-background-clip: text; background-clip: text; color: transparent;">{{card.word}}</h2>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 10px;">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; color: {{t.muted}};">{{card.ipa}}</span>
      <span style="display: flex; align-items: baseline; font-size: 15px; letter-spacing: 0.02em;">
        <span style="color: {{t.muted}};">{{card.pre}}</span><span style="font-weight: 700; color: {{t.cyanText}}; text-shadow: {{t.stressGlow}};">{{card.stressed}}</span><span style="color: {{t.muted}};">{{card.rest}}</span>
      </span>
    </div>
    <p style="margin: 16px 0 0; font-size: 15px; line-height: 1.62; color: {{t.body}}; text-wrap: pretty;">{{card.definition}}</p>

    <div style="margin-top: auto; padding-bottom: 18px; display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; height: 48px; padding: 0 4px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.glass}};">
        <button aria-label="Toggle speed" style="height: 40px; min-width: 44px; border: 0; border-radius: 999px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">1x</button>
        <span aria-hidden="true" style="width: 1px; height: 16px; background: {{t.line}};"></span>
        <button onClick="{{onListen}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: {{listenBg}}; color: {{t.cyanText}}; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <sc-if value="{{playing}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="display: flex; align-items: center; gap: 2px; height: 14px;">
              <span style="width: 2px; height: 100%; border-radius: 2px; background: currentColor; animation: sf-wave 0.9s ease-in-out infinite;"></span>
              <span style="width: 2px; height: 100%; border-radius: 2px; background: currentColor; animation: sf-wave 0.9s ease-in-out 0.15s infinite;"></span>
              <span style="width: 2px; height: 100%; border-radius: 2px; background: currentColor; animation: sf-wave 0.9s ease-in-out 0.3s infinite;"></span>
              <span style="width: 2px; height: 100%; border-radius: 2px; background: currentColor; animation: sf-wave 0.9s ease-in-out 0.45s infinite;"></span>
            </span>
          </sc-if>
          <sc-if value="{{notPlaying}}" hint-placeholder-val="{{true}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </sc-if>
          Listen
        </button>
        <span aria-hidden="true" style="width: 1px; height: 16px; background: {{t.line}};"></span>
        <button aria-label="Check pronunciation" style="width: 44px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <button style="height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; cursor: pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.cyanText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>
        Quiz me
      </button>
      <button aria-label="More actions" style="margin-left: auto; width: 48px; height: 48px; border-radius: 50%; border: 1px solid {{t.line}}; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>
  </div>

  <button onClick="{{onFlip}}" style="position: relative; z-index: 3; height: 62px; flex-shrink: 0; border: 0; border-top: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
    <span aria-hidden="true" style="position: absolute; top: -1px; left: 24%; right: 24%; height: 2px; border-radius: 2px; background: {{t.cyan}}; box-shadow: {{t.laser}};"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.cyanText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M10.5 5c-.8 3.5-3 6-6 7.5M6 9c1.2 1.8 3 3.2 5 4"/><path d="M13 21l4.5-10L22 21M14.5 17.5h6"/></svg>
    Reveal meaning
    <span style="height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid {{t.line}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; color: {{t.muted}}; display: flex; align-items: center;">Space</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tier":{"editor":"enum","options":["new","learning","mastered"],"default":"new"},"blind":{"editor":"boolean","default":false},"starred":{"editor":"boolean","default":false},"playing":{"editor":"boolean","default":false},"hover":{"editor":"boolean","default":false},"mx":{"editor":null},"my":{"editor":null},"starPulse":{"editor":null},"card":{"editor":null},"onFlip":{"editor":null},"onStar":{"editor":null},"onBlind":{"editor":null},"onListen":{"editor":null},"$preview":{"width":460,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = dark ? {
      bg: '#0a1519', fadeMid: 'rgb(10 21 25 / 0.8)', text: '#eef5f7', body: '#c9d6db', muted: '#93a8b0',
      line: 'rgb(255 255 255 / 0.1)', glass: 'rgb(255 255 255 / 0.06)',
      cyan: '#22d3ee', cyanText: '#67e8f9',
      wordGradient: 'linear-gradient(135deg, #ffffff 0%, #eaf8fb 55%, #a5eaf5 100%)',
      stressGlow: '0 0 10px rgb(34 211 238 / 0.75)', laser: '0 0 12px #22d3ee, 0 0 24px #06b6d4',
      spot: 'rgb(34 211 238 / 0.13)',
      shadow: '0 30px 70px -24px rgb(0 0 0 / 0.85), inset 0 1px 1px rgb(255 255 255 / 0.14)',
    } : {
      bg: '#ffffff', fadeMid: 'rgb(255 255 255 / 0.82)', text: '#0f1d24', body: '#33464e', muted: '#5a6d75',
      line: '#e2e9ec', glass: '#f3f7f8',
      cyan: '#06b6d4', cyanText: '#0e7490',
      wordGradient: 'linear-gradient(135deg, #0f1d24 0%, #1d3a44 60%, #0e7490 100%)',
      stressGlow: '0 0 8px rgb(6 182 212 / 0.35)', laser: '0 0 10px rgb(6 182 212 / 0.55)',
      spot: 'rgb(2 132 199 / 0.09)',
      shadow: '0 28px 60px -28px rgb(15 23 42 / 0.28), inset 0 1px 1px rgb(255 255 255 / 0.9)',
    };
    const tier = this.props.tier ?? 'new';
    const tiers = {
      new: { label: 'New', color: dark ? '#c7d2d8' : '#5a6d75',
        rim: dark ? 'linear-gradient(160deg, rgb(255 255 255 / 0.34), rgb(255 255 255 / 0.08) 40%, rgb(255 255 255 / 0.16))' : 'linear-gradient(160deg, rgb(15 23 42 / 0.14), rgb(15 23 42 / 0.06))',
        glow: '' },
      learning: { label: 'Learning', color: dark ? '#67e8f9' : '#0e7490',
        rim: 'linear-gradient(160deg, #67e8f9, rgb(34 211 238 / 0.15) 45%, #0891b2)',
        glow: ', 0 0 40px -12px rgb(34 211 238 / 0.45)' },
      mastered: { label: 'Mastered', color: dark ? '#fcd34d' : '#a16207',
        rim: 'conic-gradient(from 210deg, #fde68a, #f59e0b, #fff7d6, #67e8f9, #fbbf24, #fde68a)',
        glow: ', 0 0 46px -12px rgb(251 191 36 / 0.5)' },
    };
    const tv = tiers[tier] ?? tiers.new;
    const blind = !!this.props.blind;
    const starred = !!this.props.starred;
    const playing = !!this.props.playing;
    const mx = this.props.mx ?? 30;
    const noop = () => {};
    return {
      t,
      rim: tv.rim, tierColor: tv.color, tierLabel: tv.label,
      shadow: t.shadow + tv.glow,
      mastered: tier === 'mastered', foilPos: 100 - mx,
      card: this.props.card ?? {
        word: 'Spelling', pos: 'Noun', category: 'Language',
        ipa: '/ˈspelɪŋ/', pre: '', stressed: 'spel', rest: '·ling',
        definition: 'The process or ability of writing or naming the letters that form a word in the correct sequence.',
        image: '../assets/blob/ed058680c239cce56bb63500ca7dd0e4.jpg',
      },
      mx, my: this.props.my ?? 22,
      spotOpacity: this.props.hover ? 1 : 0,
      blind, playing, notPlaying: !playing,
      imgFilter: blind ? 'blur(22px) saturate(0.5)' : 'none',
      imgScale: blind ? 1.12 : 1,
      blindBg: blind ? t.cyan : 'rgb(6 14 18 / 0.55)',
      blindBorder: blind ? t.cyan : 'rgb(255 255 255 / 0.26)',
      starBg: starred ? '#fbbf24' : 'rgb(6 14 18 / 0.55)',
      starBorder: starred ? '#fcd34d' : 'rgb(255 255 255 / 0.26)',
      starColor: starred ? '#1a1204' : '#ffffff',
      starFill: starred ? '#1a1204' : 'none',
      starAnim: this.props.starPulse ? 'sf-star-pop' : '',
      listenBg: playing ? (dark ? 'rgb(34 211 238 / 0.16)' : 'rgb(6 182 212 / 0.12)') : 'transparent',
      onFlip: this.props.onFlip ?? noop,
      onStar: this.props.onStar ?? noop,
      onBlind: this.props.onBlind ?? noop,
      onListen: this.props.onListen ?? noop,
    };
  }
}
</script>
</body>
</html>
