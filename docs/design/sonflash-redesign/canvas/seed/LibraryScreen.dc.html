<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vocabulary library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: {{t.pageBg}};">

  <sc-if value="{{t.dark}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;">
      <div class="au-blob-a" style="position: absolute; left: 900px; top: -200px; width: 600px; height: 500px; border-radius: 50%; background: rgb(150 108 215 / 0.3); filter: blur(130px);"></div>
      <div class="au-blob-c" style="position: absolute; left: -200px; top: -200px; width: 600px; height: 500px; border-radius: 50%; background: rgb(40 211 244 / 0.2); filter: blur(130px);"></div>
    </div>
  </sc-if>
  <svg aria-hidden="true" width="1440" height="900" style="position: absolute; inset: 0; pointer-events: none; opacity: {{t.grainOpacity}}; mix-blend-mode: {{t.grainBlend}};"><filter id="lib-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix values="{{t.grainMatrix}}"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#lib-grain)"></rect></svg>

  <header style="position: relative; z-index: 3; height: 76px; padding: 0 56px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid {{t.navLine}};">
    <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{t.text}};">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: {{t.logoBg}}; box-shadow: {{t.logoShadow}}; display: flex; align-items: center; justify-content: center; color: {{t.logoText}}; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 18px; font-weight: 500;">S</span>
      <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 450; letter-spacing: -0.01em;">Son<span style="font-style: {{t.emStyle}}; color: {{t.emColor}};">Flash</span></span>
    </a>
    <nav aria-label="Main" style="margin-left: 24px; display: flex; gap: 4px;">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="#" aria-current="{{n.current}}" style="height: 38px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 550; color: {{n.color}}; background: {{n.bg}};">{{n.label}}</a>
      </sc-for>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <button onClick="{{toggleTheme}}" aria-label="{{t.toggleLabel}}" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <sc-if value="{{t.dark}}" hint-placeholder-val="{{true}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <sc-if value="{{t.light}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg></sc-if>
      </button>
      <span style="height: 38px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid {{t.warmLine}}; background: {{t.warmBg}}; color: {{t.warm}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5.5-1.5 8.2 0 1.4 1 2.5 2.3 2.5 1.5 0 2.4-1.2 2.2-3 2.3 1.7 3.5 4.3 3.5 6.8C18.5 20 15.6 22 12 22s-6.5-2.3-6.5-5.9c0-4.7 4.3-7 6.5-14.1z"></path></svg>
        12
      </span>
      <span style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.chipBg}}; color: {{t.text}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.text2}};">Lv</span>7
      </span>
      <button aria-label="Account" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.avatarBg}}; color: {{t.avatarText}}; font-size: 13px; font-weight: 700; cursor: pointer;">KB</button>
    </div>
  </header>

  <main style="position: relative; z-index: 2; padding: 36px 56px 0;">
    <div style="display: flex; align-items: flex-end; gap: 20px;">
      <div>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: {{t.textStrong}};">Vocabulary</h1>
        <p style="margin: 10px 0 0; font-size: 14px; color: {{t.text2}};"><span style="font-family: 'Geist Mono', ui-monospace, monospace; color: {{t.text}};">1,228</span> words across 4 decks · <span style="color: {{t.accentText}}; font-weight: 600;">12 due today</span></p>
      </div>
      <label style="margin-left: auto; width: 340px; height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: {{t.inputRadius}}; border: 1px solid {{t.line}}; background: {{t.inputBg}}; box-shadow: {{t.inputShadow}}; display: flex; align-items: center; gap: 10px; color: {{t.text2}};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search words</span>
        <input placeholder="Search words or meanings" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 14px;">
        <span style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid {{t.line}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; display: flex; align-items: center;">/</span>
      </label>
      <button class="sf-press" style="height: 48px; padding: 0 20px 0 16px; border-radius: {{t.btnRadius}}; border: 0; background: {{t.primaryBg}}; color: {{t.primaryText}}; box-shadow: {{t.primaryShadow}}; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Create card
      </button>
    </div>

    <div style="margin-top: 26px; display: flex; align-items: center; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid {{t.line}};">
      <div role="tablist" aria-label="Decks" style="display: flex; gap: 4px;">
        <sc-for list="{{decks}}" as="d" hint-placeholder-count="5">
          <button role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.color}}; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">{{d.name}}<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 500; opacity: 0.65;">{{d.count}}</span></button>
        </sc-for>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font-size: 13px; font-weight: 550; display: flex; align-items: center; gap: 7px; cursor: pointer;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{f.dot}}; box-shadow: {{f.glow}};"></span>{{f.label}}</button>
        </sc-for>
        <span aria-hidden="true" style="width: 1px; height: 22px; margin: 0 6px; background: {{t.line}};"></span>
        <div role="group" aria-label="View" style="display: flex; padding: 3px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.chipBg}};">
          <button aria-label="Grid view" aria-pressed="true" style="width: 38px; height: 32px; border-radius: 9px; border: 0; background: {{t.segOnBg}}; color: {{t.segOnText}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg></button>
          <button aria-label="List view" aria-pressed="false" style="width: 38px; height: 32px; border-radius: 9px; border: 0; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
        </div>
      </div>
    </div>

    <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px;">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
        <a href="#" class="sf-lift" style="position: relative; height: 272px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; text-decoration: none; color: {{t.text}}; border-radius: {{t.miniRadius}}px; border: {{c.border}}; background: {{c.bg}}; box-shadow: {{c.shadow}};">
          <div style="position: relative; flex-shrink: 0; height: 116px; margin: {{t.imgMargin}}; border-radius: {{t.imgRadius}}; overflow: hidden; background: {{c.cover}};">
            <sc-if value="{{c.hasImage}}" hint-placeholder-val="{{true}}">
              <img src="{{c.image}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; -webkit-mask-image: {{t.imgMask}}; mask-image: {{t.imgMask}};">
            </sc-if>
            <sc-if value="{{c.noImage}}" hint-placeholder-val="{{false}}">
              <div aria-hidden="true" style="position: absolute; right: 10px; bottom: -34px; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 400; font-size: 150px; line-height: 1; color: {{c.coverGlyph}};">{{c.initial}}</div>
              <div style="position: absolute; left: 14px; bottom: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{c.coverLabel}};">{{c.category}}</div>
            </sc-if>
            <sc-if value="{{c.due}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 10px; left: 10px; height: 24px; padding: 0 9px; border-radius: 999px; background: {{t.dueBg}}; color: {{t.dueText}}; border: 1px solid {{t.dueLine}}; font-size: 11px; font-weight: 650; display: flex; align-items: center; gap: 5px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>Due</span>
            </sc-if>
            <sc-if value="{{c.starred}}" hint-placeholder-val="{{false}}">
              <span aria-label="Starred" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: {{t.starBg}}; color: {{t.starText}}; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></span>
            </sc-if>
          </div>
          <div style="flex-grow: 1; padding: {{t.miniPad}}; display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 550; letter-spacing: 0.07em; text-transform: uppercase; color: {{t.text2}};">
              <span style="width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; background: {{c.tierDot}}; border: {{c.tierDotBorder}}; box-shadow: {{c.tierGlow}};"></span>{{c.tierLabel}}<span style="opacity: 0.5;">·</span>{{c.pos}}
            </div>
            <div style="margin-top: 8px; font-family: Fraunces, Georgia, serif; font-optical-sizing: auto; font-weight: {{t.displayWeight}}; font-size: 30px; line-height: 1.02; letter-spacing: -0.02em; color: {{t.textStrong}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.pre}}<span style="font-style: {{t.emStyle}}; color: {{c.stressColor}};">{{c.stress}}</span>{{c.rest}}</div>
            <div style="margin-top: 6px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: {{t.text3}};">{{c.ipa}}</div>
            <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px;">
              <span style="color: {{t.body}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.meaning}}</span>
              <span style="flex-shrink: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: {{c.nextColor}};">{{c.next}}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"onToggleTheme":{"editor":null},"$preview":{"width":1440,"height":900}}'>

      { word: 'Exact', pre: 'Ex', stress: 'act', rest: '', ipa: '/ɪɡˈzækt/', pos: 'Adj', meaning: 'Chính xác', tier: 'new', next: 'new', category: 'Accuracy', cover: 'amber' },
      { word: 'Recharge', pre: 'Re', stress: 'charge', rest: '', ipa: '/ˌriːˈtʃɑːrdʒ/', pos: 'Verb', meaning: 'Sạc lại; lấy lại sức', tier: 'learning', next: 'now', due: true, category: 'Energy', cover: 'teal' },
      { word: 'Centre', pre: '', stress: 'Cen', rest: 'tre', ipa: '/ˈsentə/', pos: 'Noun', meaning: 'Trung tâm', tier: 'learning', next: '5d', category: 'Location', cover: 'violet' },
      { word: 'Warden', pre: '', stress: 'War', rest: 'den', ipa: '/ˈwɔːrdn/', pos: 'Noun', meaning: 'Người quản lý', tier: 'new', next: 'new', category: 'People', cover: 'amber' },
      { word: 'Ambition', pre: 'Am', stress: 'bi', rest: 'tion', ipa: '/æmˈbɪʃn/', pos: 'Noun', meaning: 'Hoài bão', tier: 'mastered', next: '48d', category: 'Ambition', cover: 'teal' },
    ];
    const s = this.state;
    const filterDefs = [
      { label: 'All', key: null, dot: dark ? '#e5ecf1' : '#1d1a16' },
      { label: 'Due', key: 'due', dot: dark ? '#7ee6fa' : '#97400d' },
      { label: 'New', key: 'new', dot: 'transparent' },
      { label: 'Learning', key: 'learning', dot: dark ? '#28d3f4' : '#337344' },
      { label: 'Mastered', key: 'mastered', dot: dark ? '#f5ae39' : '#b8862b' },
    ];
    const fk = filterDefs[s.filter].key;
    const visible = raw.filter(c => !fk || (fk === 'due' ? c.due : c.tier === fk));
    const deckDefs = [['All decks', '1,228'], ['Unassigned', '842'], ['Deep learning', '96'], ['TACN', '170'], ['IELTS', '120']];
    const navItems = ['Today', 'Paths', 'Vocabulary', 'Progress'];
    return {
      t,
      toggleTheme: this.props.onToggleTheme ?? (() => {}),
      nav: navItems.map((label, i) => ({ label, current: i === 2 ? 'page' : 'false', bg: i === 2 ? t.navActiveBg : 'transparent', color: i === 2 ? t.navActiveText : t.navText })),
      decks: deckDefs.map(([name, count], i) => {
        const on = s.deck === i;
        return { name, count, selected: on ? 'true' : 'false', pick: () => this.setState({ deck: i }),
          bg: on ? t.navActiveBg : 'transparent', color: on ? t.navActiveText : t.text2, border: on ? 'transparent' : t.line };
      }),
      filters: filterDefs.map((f, i) => {
        const on = s.filter === i;
        return { label: f.label, on: on ? 'true' : 'false', pick: () => this.setState({ filter: i }),
          dot: f.dot, glow: dark && f.dot !== 'transparent' ? '0 0 6px ' + f.dot : 'none',
          bg: on ? t.segOnBg : 'transparent', color: on ? t.segOnText : t.text2, border: on ? 'transparent' : t.line };
      }),
      cards: visible.map(c => {
        const ts = tierStyle[c.tier];
        const cv = covers[c.cover ?? 'teal'];
        return {
          ...c,
          hasImage: !!c.image, noImage: !c.image, initial: c.word[0],
          cover: c.image ? 'transparent' : cv.cover, coverGlyph: cv.glyph, coverLabel: cv.label,
          due: !!c.due, starred: !!c.starred,
          tierLabel: ts.label, tierDot: ts.dot, tierDotBorder: ts.dotBorder, tierGlow: ts.glow, stressColor: ts.stress,
          border: dark ? ts.border : '0',
          bg: dark ? t.cardBg + ' padding-box, ' + ts.rim + ' border-box' : t.cardBg,
          shadow: dark ? t.cardShadow + ts.glowCard : t.cardShadow,
          next: c.next === 'now' ? 'due now' : c.next === 'new' ? 'unseen' : 'in ' + c.next,
          nextColor: c.next === 'now' ? t.accentText : t.text3,
        };
      }),
    };
  }
}
</script>
