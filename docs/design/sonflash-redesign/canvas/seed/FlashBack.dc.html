<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flashcard — Vietnamese side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 460px; height: 620px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 32px; border: 1.5px solid transparent; background: {{t.slab}}, {{rim}}; background-origin: border-box; background-clip: padding-box, padding-box, padding-box, padding-box, border-box; color: {{t.text}}; font-family: Geist, 'Segoe UI', system-ui, sans-serif; box-shadow: {{shadow}};">

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(circle at {{mx}}% {{my}}%, {{t.spot}} 0%, transparent 62%); opacity: {{spotOpacity}}; transition: opacity 200ms ease;"></div>
  <sc-if value="{{mastered}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 31; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(115deg, transparent 28%, rgb(255 226 150 / 0.18) 42%, rgb(150 240 255 / 0.14) 52%, rgb(255 170 230 / 0.1) 60%, transparent 74%); background-size: 260% 100%; background-position: {{foilPos}}% 0; transition: background-position 300ms ease-out;"></div>
  </sc-if>

  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 20px 0 28px;">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{t.cyanText}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.cyan}}; box-shadow: 0 0 8px {{t.cyan}};"></span>Vietnamese</span>
    <sc-if value="{{card.due}}" hint-placeholder-val="{{false}}">
      <span style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{t.dangerBg}}; color: {{t.danger}}; font-size: 12px; font-weight: 600; display: flex; align-items: center;">Due for review</span>
    </sc-if>
    <button onClick="{{onStar}}" aria-label="Star this word" style="margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{starBorder}}; background: {{starBg}}; color: {{starColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span class="{{starAnim}}" style="display: inline-flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{starFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></span>
    </button>
  </div>

  <div style="position: relative; z-index: 2; flex-grow: 1; display: flex; flex-direction: column; padding: 0 30px; min-height: 0;">
    <div class="{{revealClass}}" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px;">
      <h2 lang="vi" style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 52px; line-height: 1.08; letter-spacing: -0.01em; background: {{t.meaningGradient}}; -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance;">{{card.meaning}}</h2>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 15px; font-weight: 600; color: {{t.text}};">{{card.word}}</span>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: {{t.muted}};">{{card.ipa}}</span>
        <button onClick="{{onListen}}" aria-label="Play pronunciation" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.glass}}; color: {{t.cyanText}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
      </div>
    </div>

    <figure style="margin: 0; padding: 16px 18px; border-radius: 20px; background: {{t.glass}}; border: 1px solid {{t.line}};">
      <blockquote lang="en" style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.45; color: {{t.text}};">“{{card.examplePre}}<span style="font-style: normal; font-weight: 500; color: {{t.cyanText}};">{{card.exampleWord}}</span>{{card.examplePost}}”</blockquote>
      <figcaption lang="vi" style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: {{t.muted}};">{{card.exampleVi}}</figcaption>
    </figure>

    <p lang="vi" style="margin: 14px 2px 0; font-size: 14px; line-height: 1.6; color: {{t.body}}; text-wrap: pretty;">{{card.explanation}}</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0 18px;">
      <button style="height: 48px; border-radius: 999px; border: 1px solid {{t.hookLine}}; background: {{t.hookBg}}; color: {{t.hookText}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
        Memory hook
      </button>
      <button style="height: 48px; border-radius: 999px; border: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.cyanText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        Ask AI tutor
      </button>
    </div>
  </div>

  <button onClick="{{onFlip}}" style="position: relative; z-index: 3; height: 62px; flex-shrink: 0; border: 0; border-top: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
    <span aria-hidden="true" style="position: absolute; top: -1px; left: 24%; right: 24%; height: 2px; border-radius: 2px; background: {{t.cyan}}; box-shadow: {{t.laser}};"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Back to English
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tier":{"editor":"enum","options":["new","learning","mastered"],"default":"new"},"starred":{"editor":"boolean","default":false},"hover":{"editor":"boolean","default":false},"revealed":{"editor":null},"mx":{"editor":null},"my":{"editor":null},"starPulse":{"editor":null},"card":{"editor":null},"onFlip":{"editor":null},"onStar":{"editor":null},"onListen":{"editor":null},"$preview":{"width":460,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = dark ? {
      slab: 'radial-gradient(ellipse 80% 50% at 50% 22%, rgb(20 184 166 / 0.2) 0%, transparent 70%), radial-gradient(ellipse 55% 40% at 92% 4%, rgb(245 158 11 / 0.13) 0%, transparent 60%), linear-gradient(150deg, rgb(255 255 255 / 0.06) 0%, rgb(255 255 255 / 0.01) 45%, rgb(255 255 255 / 0.03) 100%), linear-gradient(#0a1519, #0a1519)',
      text: '#eef5f7', body: '#b9c8ce', muted: '#93a8b0',
      line: 'rgb(255 255 255 / 0.1)', glass: 'rgb(255 255 255 / 0.05)',
      cyan: '#22d3ee', cyanText: '#67e8f9', danger: '#fda4af', dangerBg: 'rgb(244 63 94 / 0.16)',
      meaningGradient: 'linear-gradient(135deg, #ffffff 0%, #e6fbff 50%, #8ee6f3 100%)',
      laser: '0 0 12px #22d3ee, 0 0 24px #06b6d4', spot: 'rgb(34 211 238 / 0.12)',
      hookBg: 'rgb(251 191 36 / 0.08)', hookLine: 'rgb(251 191 36 / 0.34)', hookText: '#fcd34d',
      shadow: '0 35px 90px -22px rgb(0 0 0 / 0.75), inset 0 1.5px 1px rgb(255 255 255 / 0.28), inset 0 -1px 1px rgb(0 0 0 / 0.5)',
    } : {
      slab: 'radial-gradient(ellipse 80% 50% at 50% 22%, rgb(20 184 166 / 0.1) 0%, transparent 70%), radial-gradient(ellipse 55% 40% at 92% 4%, rgb(245 158 11 / 0.09) 0%, transparent 60%), linear-gradient(transparent, transparent), linear-gradient(#ffffff, #ffffff)',
      text: '#0f1d24', body: '#33464e', muted: '#5a6d75',
      line: '#e2e9ec', glass: '#f5f8f9',
      cyan: '#06b6d4', cyanText: '#0e7490', danger: '#be123c', dangerBg: '#fff1f2',
      meaningGradient: 'linear-gradient(135deg, #0f1d24 0%, #1d3a44 55%, #0e7490 100%)',
      laser: '0 0 10px rgb(6 182 212 / 0.55)', spot: 'rgb(2 132 199 / 0.08)',
      hookBg: '#fffbeb', hookLine: '#f5d58a', hookText: '#92400e',
      shadow: '0 28px 60px -28px rgb(15 23 42 / 0.28), inset 0 1px 1px rgb(255 255 255 / 0.9)',
    };
    const tier = this.props.tier ?? 'new';
    const rims = {
      new: { rim: dark ? 'linear-gradient(160deg, rgb(255 255 255 / 0.4), rgb(255 255 255 / 0.08) 40%, rgb(255 255 255 / 0.16))' : 'linear-gradient(160deg, rgb(15 23 42 / 0.14), rgb(15 23 42 / 0.06))', glow: '' },
      learning: { rim: 'linear-gradient(160deg, #67e8f9, rgb(34 211 238 / 0.15) 45%, #0891b2)', glow: ', 0 0 40px -12px rgb(34 211 238 / 0.45)' },
      mastered: { rim: 'conic-gradient(from 210deg, #fde68a, #f59e0b, #fff7d6, #67e8f9, #fbbf24, #fde68a)', glow: ', 0 0 46px -12px rgb(251 191 36 / 0.5)' },
    };
    const rv = rims[tier] ?? rims.new;
    const starred = !!this.props.starred;
    const mx = this.props.mx ?? 70;
    const noop = () => {};
    return {
      t, rim: rv.rim, shadow: t.shadow + rv.glow,
      mastered: tier === 'mastered', foilPos: 100 - mx,
      card: this.props.card ?? {
        word: 'Spelling', ipa: '/ˈspelɪŋ/', meaning: 'Cách đánh vần', due: false,
        examplePre: 'Check the ', exampleWord: 'spelling', examplePost: ' before you send it.',
        exampleVi: 'Kiểm tra chính tả trước khi gửi nhé.',
        explanation: 'Cách viết đúng các chữ cái của một từ; cũng dùng để chỉ khả năng viết đúng chính tả.',
      },
      mx, my: this.props.my ?? 20,
      spotOpacity: this.props.hover ? 1 : 0,
      revealClass: this.props.revealed ? 'sf-reveal' : '',
      starBg: starred ? '#fbbf24' : t.glass,
      starBorder: starred ? '#fcd34d' : t.line,
      starColor: starred ? '#1a1204' : t.text,
      starFill: starred ? '#1a1204' : 'none',
      starAnim: this.props.starPulse ? 'sf-star-pop' : '',
      onFlip: this.props.onFlip ?? noop,
      onStar: this.props.onStar ?? noop,
      onListen: this.props.onListen ?? noop,
    };
  }
}
</script>
</body>
</html>
