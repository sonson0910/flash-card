<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review session — live flashcard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071014}
button{font-family:inherit}
@keyframes sf-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes sf-star{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.22) rotate(9deg)}}
@keyframes sf-reveal-in{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.sf-star-pop{animation:sf-star 260ms cubic-bezier(.16,1,.3,1)}
.sf-reveal{animation:sf-reveal-in 260ms cubic-bezier(.16,1,.3,1) 120ms both}
@media (prefers-reduced-motion: reduce){.sf-star-pop,.sf-reveal{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; color: #eef5f7; font-family: Geist, 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at 12% -8%, rgb(8 145 178 / 0.16), transparent 34rem), radial-gradient(circle at 92% 10%, rgb(14 116 144 / 0.13), transparent 38rem), #071014;">

  <header style="width: 100%; box-sizing: border-box; height: 76px; padding: 0 40px; display: flex; align-items: center; gap: 20px;">
    <button aria-label="End session" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgb(255 255 255 / 0.12); background: rgb(255 255 255 / 0.04); color: #c9d6db; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div style="flex-grow: 1; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: rgb(255 255 255 / 0.08); overflow: hidden;">
        <div style="width: {{progress}}%; height: 100%; border-radius: 4px; background: #22d3ee; box-shadow: 0 0 10px rgb(34 211 238 / 0.6); transition: width 400ms cubic-bezier(.16,1,.3,1);"></div>
      </div>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #93a8b0;">{{position}} / 12</span>
    </div>
    <span style="width: 44px;"></span>
  </header>

  <div onMouseEnter="{{enter}}" onMouseMove="{{move}}" onMouseLeave="{{leave}}" style="position: relative; width: 460px; height: 620px; margin-top: 6px;">
    <div aria-hidden="true" style="position: absolute; inset: -18px; border-radius: 48px; filter: blur(26px); background: radial-gradient(ellipse at 50% 38%, {{aura.core}} 0%, {{aura.mid}} 45%, {{aura.outer}} 70%, transparent 85%); opacity: {{auraOpacity}}; transition: opacity 300ms ease-out;"></div>
    <div style="position: absolute; inset: 0; perspective: 1600px;">
      <div style="position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX({{rx}}deg) rotateY({{ry}}deg); transition: {{rotorTransition}};">
        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;">
          <dc-import name="FlashFront" theme="dark" tier="{{tier}}" card="{{front}}" hover="{{hover}}" mx="{{mx}}" my="{{my}}" blind="{{blind}}" starred="{{starred}}" playing="{{playing}}" star-pulse="{{starPulse}}" on-flip="{{flip}}" on-star="{{star}}" on-blind="{{toggleBlind}}" on-listen="{{listen}}" hint-size="460px,620px"></dc-import>
        </div>
        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg);">
          <dc-import name="FlashBack" theme="dark" tier="{{tier}}" card="{{back}}" hover="{{hover}}" mx="{{mx}}" my="{{my}}" starred="{{starred}}" revealed="{{revealed}}" star-pulse="{{starPulse}}" on-flip="{{flip}}" on-star="{{star}}" on-listen="{{listen}}" hint-size="460px,620px"></dc-import>
        </div>
      </div>
    </div>
  </div>

  <div style="height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
    <sc-if value="{{flipped}}" hint-placeholder-val="{{false}}">
      <div role="group" aria-label="How well did you remember?" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 560px;">
        <sc-for list="{{grades}}" as="g" hint-placeholder-count="4">
          <button onClick="{{g.pick}}" style="height: 66px; border-radius: 16px; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.color}}; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; box-shadow: {{g.shadow}};">
            {{g.label}}
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; opacity: 0.8;">{{g.key}} · {{g.next}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{notFlipped}}" hint-placeholder-val="{{true}}">
      <div style="font-size: 14px; color: #93a8b0; display: flex; align-items: center; gap: 10px;">
        Say it out loud, then reveal
        <span style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid rgb(255 255 255 / 0.14); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; display: flex; align-items: center;">Space</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 0, flipped: false, flipping: false, revealed: false, hover: false, rx: 0, ryTilt: 0, mx: 50, my: 50, starred: false, starPulse: false, blind: false, playing: false };
  }
  renderVals() {
    const s = this.state;
    const deck = [
      {
        tier: 'new',
        front: { word: 'Spelling', pos: 'Noun', category: 'Language', ipa: '/ˈspelɪŋ/', pre: '', stressed: 'spel', rest: '·ling', definition: 'The process or ability of writing or naming the letters that form a word in the correct sequence.', image: '../assets/blob/ed058680c239cce56bb63500ca7dd0e4.jpg' },
        back: { word: 'Spelling', ipa: '/ˈspelɪŋ/', meaning: 'Cách đánh vần', due: false, examplePre: 'Check the ', exampleWord: 'spelling', examplePost: ' before you send it.', exampleVi: 'Kiểm tra chính tả trước khi gửi nhé.', explanation: 'Cách viết đúng các chữ cái của một từ; cũng dùng để chỉ khả năng viết đúng chính tả.' },
        aura: { core: 'rgba(6, 182, 212, 0.75)', mid: 'rgba(14, 165, 233, 0.45)', outer: 'rgba(99, 102, 241, 0.2)' },
      },
      {
        tier: 'learning',
        front: { word: 'Immediate', pos: 'Adjective', category: 'Time and action', ipa: '/ɪˈmiːdiət/', pre: 'im·', stressed: 'me', rest: '·di·ate', definition: 'Happening or done without delay; acting or occurring at once.', image: '../assets/blob/dc9678b28352d8aeb0fea95d3a58a38d.jpg' },
        back: { word: 'Immediate', ipa: '/ɪˈmiːdiət/', meaning: 'Ngay lập tức', due: true, examplePre: 'The new policy takes ', exampleWord: 'immediate', examplePost: ' effect.', exampleVi: 'Chính sách mới có hiệu lực ngay lập tức.', explanation: 'Xảy ra hoặc được thực hiện ngay, không chậm trễ. Hay đi với effect, action, response.' },
        aura: { core: 'rgba(139, 92, 246, 0.75)', mid: 'rgba(6, 182, 212, 0.45)', outer: 'rgba(99, 102, 241, 0.2)' },
      },
      {
        tier: 'mastered',
        front: { word: 'Instant', pos: 'Noun', category: 'Time', ipa: '/ˈɪnstənt/', pre: '', stressed: 'in', rest: '·stant', definition: 'A very short period of time; a precise moment.', image: '../assets/blob/4e8348b18995828a6faaee433ba17ccd.jpg' },
        back: { word: 'Instant', ipa: '/ˈɪnstənt/', meaning: 'Khoảnh khắc', due: false, examplePre: 'For an ', exampleWord: 'instant', examplePost: ', nobody said a word.', exampleVi: 'Trong một khoảnh khắc, không ai nói lời nào.', explanation: 'Một khoảng thời gian cực ngắn, hoặc một thời điểm chính xác.' },
        aura: { core: 'rgba(251, 191, 36, 0.7)', mid: 'rgba(245, 158, 11, 0.4)', outer: 'rgba(6, 182, 212, 0.2)' },
      },
    ];
    const card = deck[s.index % deck.length];
    const later = (ms, fn) => window.setTimeout(fn, ms);
    const flip = () => {
      if (s.flipping) return;
      const next = !s.flipped;
      this.setState({ flipped: next, flipping: true, revealed: false });
      later(640, () => this.setState({ flipping: false, revealed: next }));
    };
    const gradeDefs = [
      { label: 'Again', key: '1', next: '1m', color: '#fda4af', border: 'rgb(244 63 94 / 0.35)', bg: 'rgb(244 63 94 / 0.08)', shadow: 'none' },
      { label: 'Hard', key: '2', next: '6m', color: '#eef5f7', border: 'rgb(255 255 255 / 0.12)', bg: 'rgb(255 255 255 / 0.04)', shadow: 'none' },
      { label: 'Good', key: '3', next: '1d', color: '#041418', border: '#67e8f9', bg: '#22d3ee', shadow: '0 10px 30px -10px rgb(34 211 238 / 0.7)' },
      { label: 'Easy', key: '4', next: '3d', color: '#eef5f7', border: 'rgb(255 255 255 / 0.12)', bg: 'rgb(255 255 255 / 0.04)', shadow: 'none' },
    ];
    const advance = () => this.setState({ index: s.index + 1, flipped: false, flipping: true, revealed: false, starred: false, blind: false });
    return {
      front: card.front, back: card.back, aura: card.aura, tier: card.tier,
      flipped: s.flipped, notFlipped: !s.flipped, revealed: s.revealed,
      hover: s.hover, mx: s.mx, my: s.my,
      rx: s.rx, ry: (s.flipped ? 180 : 0) + s.ryTilt,
      rotorTransition: s.flipping ? 'transform 620ms cubic-bezier(.2,.8,.2,1)' : 'transform 280ms cubic-bezier(.22,1,.36,1)',
      auraOpacity: s.hover ? 0.35 : 0,
      blind: s.blind, starred: s.starred, starPulse: s.starPulse, playing: s.playing,
      position: 5 + s.index, progress: Math.min(100, ((5 + s.index) / 12) * 100),
      grades: gradeDefs.map(g => ({ ...g, pick: () => { advance(); later(640, () => this.setState({ flipping: false })); } })),
      flip,
      enter: () => this.setState({ hover: true }),
      move: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        this.setState({ mx: px * 100, my: py * 100, rx: -(py - 0.5) * 8, ryTilt: (px - 0.5) * 8 });
      },
      leave: () => this.setState({ hover: false, rx: 0, ryTilt: 0, mx: 50, my: 50 }),
      star: () => { this.setState({ starred: !s.starred, starPulse: true }); later(280, () => this.setState({ starPulse: false })); },
      toggleBlind: () => this.setState({ blind: !s.blind }),
      listen: () => { this.setState({ playing: true }); later(1600, () => this.setState({ playing: false })); },
    };
  }
}
</script>
</body>
</html>
