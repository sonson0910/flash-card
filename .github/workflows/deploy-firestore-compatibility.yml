name: Deploy preparatory Firestore compatibility Rules

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full reviewed main revision containing the compatible client and Rules
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful attempt of that release-candidate run
        required: true
        type: string
      candidate_sha256:
        description: Candidate SHA-256 shown in that workflow summary
        required: true
        type: string
      compatibility_rules_sha256:
        description: SHA-256 of the sealed preparatory compatibility Rules file
        required: true
        type: string
      approval_ref:
        description: Change ticket or approval record reviewed by the environment approver
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-provenance
  cancel-in-progress: false

jobs:
  validate_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable compatibility inputs
        shell: bash
        env:
          APPROVAL_REF: ${{ inputs.approval_ref }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          COMPATIBILITY_RULES_SHA256: ${{ inputs.compatibility_rules_sha256 }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REVISION" = "$GITHUB_SHA"
          [[ "$REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$COMPATIBILITY_RULES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_REF" =~ ^[A-Za-z0-9._:/-]{8,200}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Verify reviewed main source and compatibility digest
        shell: bash
        env:
          COMPATIBILITY_RULES_SHA256: ${{ inputs.compatibility_rules_sha256 }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/main
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(sha256sum firestore.compatibility.rules | cut -d ' ' -f 1)" = "$COMPATIBILITY_RULES_SHA256"

      - name: Verify release-candidate workflow provenance
        shell: bash
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/attempts/${CANDIDATE_RUN_ATTEMPT}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$REVISION"
          test "$(jq -r '.run_attempt' <<<"$run_json")" = "$CANDIDATE_RUN_ATTEMPT"
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/release-candidate.yml"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download the sealed candidate from its source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lingoflash-${{ inputs.revision }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify the sealed compatibility artifact before approval
        shell: bash
        env:
          COMPATIBILITY_RULES_SHA256: ${{ inputs.compatibility_rules_sha256 }}
        run: |
          set -euo pipefail
          node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "${{ inputs.revision }}" --workflow-run-id "${{ inputs.candidate_run_id }}" --workflow-run-attempt "${{ inputs.candidate_run_attempt }}" --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          test "$(sha256sum candidate/firestore.compatibility.rules | cut -d ' ' -f 1)" = "$COMPATIBILITY_RULES_SHA256"
          cmp --silent firestore.compatibility.rules candidate/firestore.compatibility.rules

      - name: Retain the validated compatibility candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-firestore-compatibility-${{ github.run_id }}
          path: candidate
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  deploy_compatibility_rules:
    needs: validate_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-rules-cutover
    outputs:
      firebase_project_id: ${{ steps.candidate_target.outputs.firebase_project_id }}
      firestore_database_id: ${{ steps.candidate_target.outputs.firestore_database_id }}
      provider_verified: ${{ steps.provider_readback.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Re-verify protected source provenance
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REVISION" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" origin/main
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-firestore-compatibility-${{ github.run_id }}
          path: candidate

      - name: Re-verify protected compatibility artifact and target
        id: candidate_target
        shell: bash
        env:
          COMPATIBILITY_RULES_SHA256: ${{ inputs.compatibility_rules_sha256 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
        run: |
          set -euo pipefail
          [[ "$FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$FIRESTORE_DATABASE_ID" =~ ^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$ ]]
          node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "${{ inputs.revision }}" --workflow-run-id "${{ inputs.candidate_run_id }}" --workflow-run-attempt "${{ inputs.candidate_run_attempt }}" --candidate-sha256 "${{ inputs.candidate_sha256 }}" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID"
          test "$(sha256sum candidate/firestore.compatibility.rules | cut -d ' ' -f 1)" = "$COMPATIBILITY_RULES_SHA256"
          cmp --silent firestore.compatibility.rules candidate/firestore.compatibility.rules
          node scripts/release-artifact.mjs promote-config --root candidate --source firebase.json --output firebase.compatibility.json --database-id "$FIRESTORE_DATABASE_ID" --firestore-rules firestore.compatibility.rules
          printf 'firebase_project_id=%s\n' "$FIREBASE_PROJECT_ID" >> "$GITHUB_OUTPUT"
          printf 'firestore_database_id=%s\n' "$FIRESTORE_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: google_auth
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          token_format: access_token

      - name: Deploy only the sealed preparatory compatibility Rules
        working-directory: candidate
        run: npx --yes firebase-tools@15.23.0 deploy --only firestore:rules --config firebase.compatibility.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Verify active compatibility Rules provider provenance
        id: provider_readback
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node scripts/provider-release-readback.mjs rules \
            --project-id "$FIREBASE_PROJECT_ID" \
            --database-id "$FIRESTORE_DATABASE_ID" \
            --rules-file candidate/firestore.compatibility.rules
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

  record_compatibility:
    name: record_compatibility
    needs: [validate_candidate, deploy_compatibility_rules]
    if: ${{ needs.validate_candidate.result == 'success' && needs.deploy_compatibility_rules.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-firestore-compatibility-${{ github.run_id }}
          path: candidate

      - name: Record immutable compatibility deployment provenance
        shell: bash
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          COMPATIBILITY_RULES_SHA256: ${{ inputs.compatibility_rules_sha256 }}
          COMPATIBILITY_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMPATIBILITY_RUN_ID: ${{ github.run_id }}
          FIREBASE_PROJECT_ID: ${{ needs.deploy_compatibility_rules.outputs.firebase_project_id }}
          FIRESTORE_DATABASE_ID: ${{ needs.deploy_compatibility_rules.outputs.firestore_database_id }}
          PROVIDER_VERIFIED: ${{ needs.deploy_compatibility_rules.outputs.provider_verified }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$PROVIDER_VERIFIED" = "true"
          rules=candidate/firestore.compatibility.rules
          test -f "$rules"
          test ! -L "$rules"
          test "$(sha256sum "$rules" | cut -d ' ' -f 1)" = "$COMPATIBILITY_RULES_SHA256"
          recorded_at="$(node --input-type=module -e 'process.stdout.write(new Date().toISOString())')"
          evidence_directory=firestore-compatibility-evidence
          mkdir -p "$evidence_directory"
          jq -n \
            --arg revision "$REVISION" \
            --argjson candidateRunId "$CANDIDATE_RUN_ID" \
            --argjson candidateRunAttempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg candidateSha256 "$CANDIDATE_SHA256" \
            --argjson compatibilityRunId "$COMPATIBILITY_RUN_ID" \
            --argjson compatibilityRunAttempt "$COMPATIBILITY_RUN_ATTEMPT" \
            --arg compatibilityRulesSha256 "$COMPATIBILITY_RULES_SHA256" \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg databaseId "$FIRESTORE_DATABASE_ID" \
            --arg recordedAt "$recorded_at" \
            '{schemaVersion:1,revision:$revision,candidateRunId:$candidateRunId,candidateRunAttempt:$candidateRunAttempt,candidateSha256:$candidateSha256,compatibilityRunId:$compatibilityRunId,compatibilityRunAttempt:$compatibilityRunAttempt,compatibilityRulesSha256:$compatibilityRulesSha256,projectId:$projectId,databaseId:$databaseId,providerVerified:true,recordedAt:$recordedAt}' \
            > "$evidence_directory/compatibility.json"
          test "$(stat --format=%s "$evidence_directory/compatibility.json")" -le 4096
          evidence_sha256="$(sha256sum "$evidence_directory/compatibility.json" | cut -d ' ' -f 1)"
          printf 'Compatibility run `%s` attempt `%s` evidence SHA-256: `%s`\n' "$COMPATIBILITY_RUN_ID" "$COMPATIBILITY_RUN_ATTEMPT" "$evidence_sha256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-compatibility-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: firestore-compatibility-evidence/compatibility.json
          if-no-files-found: error
          retention-days: 2
