name: Execute and attest reservation migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the bounded owner migration before final evidence is externally sealed
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply, rollback]
      operation:
        description: Rules operation authorized by the evidence
        required: true
        default: cutover
        type: choice
        options: [cutover, rollback]
      revision:
        description: Full compatible client and Firestore Rules revision
        required: true
        type: string
      confirmation:
        description: Apply requires APPLY_QUERY_V2; rollback requires ROLLBACK_QUERY_V2
        required: false
        type: string
      owner_id:
        description: Explicit owner ID for the bounded dry-run, apply, or rollback
        required: true
        type: string
      owner_key:
        description: Matching 12-character SHA-256 owner key for every migration mode
        required: true
        type: string
      enforcement_run_id:
        description: Exact successful strict-enforcement workflow run ID (required for apply or rollback)
        required: false
        type: string
      enforcement_run_attempt:
        description: Exact successful strict-enforcement workflow run attempt (required for apply or rollback)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-provenance
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-rules-cutover
    outputs:
      migration_completed_at: ${{ steps.migration.outputs.completed_at }}
      migration_run_id: ${{ steps.migration.outputs.run_id }}
      migration_run_attempt: ${{ steps.migration.outputs.run_attempt }}
      enforcement_evidence_sha256: ${{ steps.enforcement.outputs.evidence_sha256 }}
      rollback_ciphertext_sha256: ${{ steps.authorization.outputs.ciphertext_sha256 }}
      rollback_object_descriptor_sha256: ${{ steps.authorization.outputs.object_descriptor_sha256 }}
    steps:
      - name: Validate immutable migration inputs
        shell: bash
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          MIGRATION_OWNER_ID: ${{ inputs.owner_id }}
          MIGRATION_OWNER_KEY: ${{ inputs.owner_key }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$GITHUB_SHA" = "$RELEASE_REVISION"
          [[ "$MIGRATION_OWNER_ID" =~ ^[a-zA-Z0-9:_-]{1,128}$ ]]
          [[ "$MIGRATION_OWNER_KEY" =~ ^[a-f0-9]{12}$ ]]
          expected_owner_key="$(node --input-type=module -e 'import { createHash } from "node:crypto"; process.stdout.write(createHash("sha256").update(process.env.MIGRATION_OWNER_ID).digest("hex").slice(0, 12));')"
          test "$MIGRATION_OWNER_KEY" = "$expected_owner_key"
          if [[ "$MIGRATION_MODE" != "dry-run" ]]; then
            [[ "$ENFORCEMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$ENFORCEMENT_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          fi
          if [[ "$MIGRATION_MODE" == "apply" ]]; then
            test "$MIGRATION_OPERATION" = "cutover"
            test "$MIGRATION_CONFIRMATION" = "APPLY_QUERY_V2"
          fi
          if [[ "$MIGRATION_MODE" == "rollback" ]]; then
            test "$MIGRATION_OPERATION" = "rollback"
            test "$MIGRATION_CONFIRMATION" = "ROLLBACK_QUERY_V2"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Verify checked-out main ancestry
        shell: bash
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git merge-base --is-ancestor "$RELEASE_REVISION" origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify exact strict-enforcement workflow provenance
        if: ${{ inputs.mode != 'dry-run' }}
        shell: bash
        env:
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          enforcement_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ENFORCEMENT_RUN_ID}/attempts/${ENFORCEMENT_RUN_ATTEMPT}")"
          test "$(jq -r '.conclusion' <<<"$enforcement_json")" = "success"
          test "$(jq -r '.event' <<<"$enforcement_json")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' <<<"$enforcement_json")" = "$RELEASE_REVISION"
          test "$(jq -r '.run_attempt' <<<"$enforcement_json")" = "$ENFORCEMENT_RUN_ATTEMPT"
          test "$(jq -r '.path' <<<"$enforcement_json")" = ".github/workflows/deploy-firestore-enforcement.yml"
          enforcement_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ENFORCEMENT_RUN_ID}/attempts/${ENFORCEMENT_RUN_ATTEMPT}/jobs?per_page=100")"
          jq -e '.jobs | any(.name == "deploy_enforcement_rules" and .status == "completed" and .conclusion == "success")' <<<"$enforcement_jobs" >/dev/null
          jq -e '.jobs | any(.name == "record_enforcement" and .status == "completed" and .conclusion == "success")' <<<"$enforcement_jobs" >/dev/null

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.mode != 'dry-run' }}
        with:
          name: firestore-enforcement-evidence-${{ inputs.enforcement_run_id }}-${{ inputs.enforcement_run_attempt }}
          path: strict-enforcement-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.enforcement_run_id }}

      - name: Verify immutable strict-enforcement evidence
        id: enforcement
        if: ${{ inputs.mode != 'dry-run' }}
        shell: bash
        env:
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          evidence=strict-enforcement-evidence/enforcement.json
          test -f "$evidence"
          test ! -L "$evidence"
          test "$(stat --format=%s "$evidence")" -le 4096
          node scripts/firestore-enforcement-evidence.mjs verify --file "$evidence" --revision "$RELEASE_REVISION" --enforcement-run-id "$ENFORCEMENT_RUN_ID" --enforcement-run-attempt "$ENFORCEMENT_RUN_ATTEMPT" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID" --rules-file firestore.rules
          evidence_sha256="$(sha256sum "$evidence" | cut -d ' ' -f 1)"
          printf 'evidence_sha256=%s\n' "$evidence_sha256" >> "$GITHUB_OUTPUT"
          printf 'Verified strict enforcement evidence SHA-256: `%s`\n' "$evidence_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Install, test and compile the Admin migrator
        working-directory: functions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Verify reviewed attestation trust root before migration
        shell: bash
        env:
          EVIDENCE_ATTESTATION_KMS_KEY_VERSION: ${{ vars.EVIDENCE_ATTESTATION_KMS_KEY_VERSION }}
        run: |
          set -euo pipefail
          trust_root=evidence-attestation-trust-root.json
          test -f "$trust_root"
          test ! -L "$trust_root"
          reviewed_kms_key_version="$(jq -er '.evidenceAttestationKmsKeyVersion' "$trust_root")"
          reviewed_kms_algorithm="$(jq -er '.evidenceAttestationKmsAlgorithm' "$trust_root")"
          reviewed_kms_fingerprint="$(jq -er '.evidenceAttestationPublicKeySpkiSha256' "$trust_root")"
          [[ "$reviewed_kms_key_version" =~ ^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]/locations/[a-z0-9-]{1,63}/keyRings/[A-Za-z0-9_-]{1,63}/cryptoKeys/[A-Za-z0-9_-]{1,63}/cryptoKeyVersions/[1-9][0-9]{0,19}$ ]]
          [[ "$reviewed_kms_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          case "$reviewed_kms_algorithm" in
            EC_SIGN_P256_SHA256|RSA_SIGN_PKCS1_2048_SHA256|RSA_SIGN_PKCS1_3072_SHA256|RSA_SIGN_PKCS1_4096_SHA256) ;;
            *) echo "Unsupported evidence attestation KMS algorithm." >&2; exit 1 ;;
          esac
          test "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" = "$reviewed_kms_key_version"
          IFS=/ read -r _ kms_project _ kms_location _ kms_keyring _ kms_key _ kms_version <<<"$reviewed_kms_key_version"
          metadata_directory="$RUNNER_TEMP/evidence-attestation-trust-root"
          mkdir -p "$metadata_directory"
          umask 077
          gcloud kms keys versions describe "$kms_version" --project="$kms_project" --location="$kms_location" --keyring="$kms_keyring" --key="$kms_key" --format='json(name,algorithm)' > "$metadata_directory/kms-metadata.json"
          gcloud kms keys versions get-public-key "$kms_version" --project="$kms_project" --location="$kms_location" --keyring="$kms_keyring" --key="$kms_key" --output-file="$metadata_directory/attestation-public-key.pem"
          node scripts/release-artifact.mjs verify-attestation-trust-root --root . --configured-kms-key-version "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" --metadata "$metadata_directory/kms-metadata.json" --public-key "$metadata_directory/attestation-public-key.pem"

      - name: Verify protected pre-mutation authorization
        id: authorization
        if: ${{ inputs.mode != 'dry-run' }}
        shell: bash
        env:
          ENFORCEMENT_EVIDENCE_SHA256: ${{ steps.enforcement.outputs.evidence_sha256 }}
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          MIGRATION_AUTHORIZATION_ATTESTATION_B64: ${{ secrets.MIGRATION_AUTHORIZATION_ATTESTATION_B64 }}
          MIGRATION_AUTHORIZATION_EVIDENCE_B64: ${{ secrets.MIGRATION_AUTHORIZATION_EVIDENCE_B64 }}
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          MIGRATION_RUN_ID: ${{ github.run_id }}
          MIGRATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          MIGRATION_OWNER_ID: ${{ inputs.owner_id }}
          RELEASE_REVISION: ${{ inputs.revision }}
          ROLLBACK_KMS_KEY_VERSION: ${{ vars.ROLLBACK_KMS_KEY_VERSION }}
          EVIDENCE_ATTESTATION_KMS_KEY_VERSION: ${{ vars.EVIDENCE_ATTESTATION_KMS_KEY_VERSION }}
          ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64: ${{ secrets.ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64 }}
          ROLLBACK_SNAPSHOT_OBJECT_BUCKET: ${{ vars.ROLLBACK_SNAPSHOT_OBJECT_BUCKET }}
          ROLLBACK_SNAPSHOT_OBJECT_PREFIX: ${{ vars.ROLLBACK_SNAPSHOT_OBJECT_PREFIX }}
        run: |
          set -euo pipefail
          test -n "$MIGRATION_AUTHORIZATION_EVIDENCE_B64"
          test -n "$MIGRATION_AUTHORIZATION_ATTESTATION_B64"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX"
          evidence_directory="$RUNNER_TEMP/reservation-migration-authorization"
          mkdir -p "$evidence_directory"
          umask 077
          printf '%s' "$MIGRATION_AUTHORIZATION_EVIDENCE_B64" | base64 --decode > "$evidence_directory/migration-authorization-evidence.json"
          printf '%s' "$ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64" | base64 --decode > "$evidence_directory/rollback-snapshot-object.json"
          printf '%s' "$MIGRATION_AUTHORIZATION_ATTESTATION_B64" | base64 --decode > "$evidence_directory/migration-authorization-attestation.json"
          attestation_file="$evidence_directory/migration-authorization-attestation.json"
          test ! -L "$attestation_file"
          test "$(stat --format=%s "$attestation_file")" -le 16384
          test "$(jq -cS 'keys' "$attestation_file")" = '["domain","payload","schemaVersion","signatureBase64"]'
          jq -e '.domain == "sonflash.reservation-migration-authorization-attestation" and .schemaVersion == 3 and (.schemaVersion | type) == "number"' "$attestation_file" >/dev/null
          test "$(jq -cS '.payload | keys' "$attestation_file")" = '["ciphertextSha256","databaseId","enforcementEvidenceSha256","enforcementRunAttempt","enforcementRunId","evidenceAttestationKmsAlgorithm","evidenceAttestationKmsKeyVersion","evidenceAttestationPublicKeySpkiSha256","evidenceSha256","migrationRunAttempt","migrationRunId","ownerCommitment","projectId","revision","rollbackKmsKeyVersion","rollbackSnapshotObject"]'
          attestation_payload="$evidence_directory/attestation-payload.json"
          attestation_signed="$evidence_directory/attestation-signed.json"
          jq -cS '.payload' "$attestation_file" > "$attestation_payload"
          jq -cS '{domain,schemaVersion,payload}' "$attestation_file" > "$attestation_signed"
          trust_root=evidence-attestation-trust-root.json
          reviewed_kms_key_version="$(jq -er '.evidenceAttestationKmsKeyVersion' "$trust_root")"
          reviewed_kms_algorithm="$(jq -er '.evidenceAttestationKmsAlgorithm' "$trust_root")"
          reviewed_kms_fingerprint="$(jq -er '.evidenceAttestationPublicKeySpkiSha256' "$trust_root")"
          test "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" = "$reviewed_kms_key_version"
          test "$(jq -r '.evidenceAttestationKmsKeyVersion' "$attestation_payload")" = "$reviewed_kms_key_version"
          test "$(jq -r '.evidenceAttestationKmsAlgorithm' "$attestation_payload")" = "$reviewed_kms_algorithm"
          test "$(jq -r '.evidenceAttestationPublicKeySpkiSha256' "$attestation_payload")" = "$reviewed_kms_fingerprint"
          expected_owner_commitment="$(printf '%s' "$MIGRATION_OWNER_ID" | sha256sum | cut -d ' ' -f 1)"
          test "$(jq -r '.ownerCommitment' "$attestation_payload")" = "$expected_owner_commitment"
          test "$(jq -r '.revision' "$attestation_payload")" = "$RELEASE_REVISION"
          test "$(jq -r '.projectId' "$attestation_payload")" = "$FIREBASE_PROJECT_ID"
          test "$(jq -r '.databaseId' "$attestation_payload")" = "$FIRESTORE_DATABASE_ID"
          test "$(jq -r '.enforcementRunId' "$attestation_payload")" = "$ENFORCEMENT_RUN_ID"
          test "$(jq -r '.enforcementRunAttempt' "$attestation_payload")" = "$ENFORCEMENT_RUN_ATTEMPT"
          test "$(jq -r '.enforcementEvidenceSha256' "$attestation_payload")" = "$ENFORCEMENT_EVIDENCE_SHA256"
          test "$(jq -r '.migrationRunId' "$attestation_payload")" = "$MIGRATION_RUN_ID"
          test "$(jq -r '.migrationRunAttempt' "$attestation_payload")" = "$MIGRATION_RUN_ATTEMPT"
          evidence_sha256="$(sha256sum "$evidence_directory/migration-authorization-evidence.json" | cut -d ' ' -f 1)"
          expected_ciphertext_sha256="$(jq -er '.ciphertextSha256 | select(type == "string" and test("^[a-f0-9]{64}$"))' "$attestation_payload")"
          test "$(jq -cS '.rollbackSnapshotObject' "$attestation_payload")" = "$(jq -cS '.' "$evidence_directory/rollback-snapshot-object.json")"
          test "$(jq -r '.evidenceSha256' "$attestation_payload")" = "$evidence_sha256"
          test "$(jq -r '.rollbackKmsKeyVersion' "$attestation_payload")" = "$ROLLBACK_KMS_KEY_VERSION"
          jq -r '.signatureBase64' "$attestation_file" | base64 --decode > "$evidence_directory/attestation-signature.bin"
          public_key="$RUNNER_TEMP/evidence-attestation-trust-root/attestation-public-key.pem"
          case "$reviewed_kms_algorithm" in
            EC_SIGN_P256_SHA256)
              openssl dgst -sha256 -verify "$public_key" -signature "$evidence_directory/attestation-signature.bin" "$attestation_signed"
              ;;
            RSA_SIGN_PKCS1_2048_SHA256|RSA_SIGN_PKCS1_3072_SHA256|RSA_SIGN_PKCS1_4096_SHA256)
              openssl dgst -sha256 -verify "$public_key" -signature "$evidence_directory/attestation-signature.bin" -sigopt rsa_padding_mode:pkcs1 "$attestation_signed"
              ;;
            *)
              echo "Unsupported evidence attestation KMS algorithm." >&2
              exit 1
              ;;
          esac
          node scripts/rollback-snapshot-object.mjs download --descriptor-file "$evidence_directory/rollback-snapshot-object.json" --output-file "$evidence_directory/rollback-snapshot.enc" --expected-bucket "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET" --expected-prefix "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX" --expected-sha256 "$expected_ciphertext_sha256"
          ciphertext_sha256="$(sha256sum "$evidence_directory/rollback-snapshot.enc" | cut -d ' ' -f 1)"
          test "$expected_ciphertext_sha256" = "$ciphertext_sha256"
          node scripts/migration-authorization-evidence.mjs verify --file "$evidence_directory/migration-authorization-evidence.json" --evidence-sha256 "$evidence_sha256" --operation "$MIGRATION_OPERATION" --migration-mode "$MIGRATION_MODE" --migration-run-id "$MIGRATION_RUN_ID" --migration-run-attempt "$MIGRATION_RUN_ATTEMPT" --enforcement-run-id "$ENFORCEMENT_RUN_ID" --enforcement-run-attempt "$ENFORCEMENT_RUN_ATTEMPT" --enforcement-evidence-sha256 "$ENFORCEMENT_EVIDENCE_SHA256" --owner-commitment "$expected_owner_commitment" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID" --client-revision "$RELEASE_REVISION" --rules-file firestore.rules --rollback-snapshot-ciphertext-file "$evidence_directory/rollback-snapshot.enc" --rollback-snapshot-object-file "$evidence_directory/rollback-snapshot-object.json" --rollback-snapshot-object-bucket "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET" --rollback-snapshot-object-prefix "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX" --kms-key-version "$ROLLBACK_KMS_KEY_VERSION"
          object_descriptor_sha256="$(jq -cS '.' "$evidence_directory/rollback-snapshot-object.json" | sha256sum | cut -d ' ' -f 1)"
          printf 'ciphertext_sha256=%s\n' "$ciphertext_sha256" >> "$GITHUB_OUTPUT"
          printf 'object_descriptor_sha256=%s\n' "$object_descriptor_sha256" >> "$GITHUB_OUTPUT"
          printf 'Migration authorization evidence SHA-256: `%s`\n' "$evidence_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded owner migration without exporting card data
        id: migration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_RUN_ID: ${{ github.run_id }}
          MIGRATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          MIGRATION_OWNER_ID: ${{ inputs.owner_id }}
          MIGRATION_OWNER_KEY: ${{ inputs.owner_key }}
        run: |
          set -euo pipefail
          node functions/lib/legacyLibraryMigrationOperator.js
          completed_at="$(node --input-type=module -e 'process.stdout.write(new Date().toISOString())')"
          printf 'completed_at=%s\n' "$completed_at" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$MIGRATION_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$MIGRATION_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'Migration run `%s` attempt `%s` completed at `%s`. Final evidence must bind all three values.\n' "$MIGRATION_RUN_ID" "$MIGRATION_RUN_ATTEMPT" "$completed_at" >> "$GITHUB_STEP_SUMMARY"

  attest_final_state:
    if: ${{ inputs.mode != 'dry-run' }}
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-rules-cutover
    steps:
      - name: Validate final-evidence execution binding
        shell: bash
        env:
          ENFORCEMENT_EVIDENCE_SHA256: ${{ needs.migrate.outputs.enforcement_evidence_sha256 }}
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          MIGRATION_COMPLETED_AT: ${{ needs.migrate.outputs.migration_completed_at }}
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_RUN_ID: ${{ needs.migrate.outputs.migration_run_id }}
          MIGRATION_RUN_ATTEMPT: ${{ needs.migrate.outputs.migration_run_attempt }}
          ROLLBACK_CIPHERTEXT_SHA256: ${{ needs.migrate.outputs.rollback_ciphertext_sha256 }}
          ROLLBACK_OBJECT_DESCRIPTOR_SHA256: ${{ needs.migrate.outputs.rollback_object_descriptor_sha256 }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MIGRATION_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$ENFORCEMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ENFORCEMENT_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$ENFORCEMENT_EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$MIGRATION_COMPLETED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          [[ "$MIGRATION_MODE" =~ ^(apply|rollback)$ ]]
          [[ "$ROLLBACK_CIPHERTEXT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$ROLLBACK_OBJECT_DESCRIPTOR_SHA256" =~ ^[a-f0-9]{64}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Re-verify checked-out main ancestry before final attestation
        shell: bash
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git merge-base --is-ancestor "$RELEASE_REVISION" origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Re-verify strict-enforcement workflow provenance for final evidence
        shell: bash
        env:
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          enforcement_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ENFORCEMENT_RUN_ID}/attempts/${ENFORCEMENT_RUN_ATTEMPT}")"
          test "$(jq -r '.conclusion' <<<"$enforcement_json")" = "success"
          test "$(jq -r '.event' <<<"$enforcement_json")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' <<<"$enforcement_json")" = "$RELEASE_REVISION"
          test "$(jq -r '.run_attempt' <<<"$enforcement_json")" = "$ENFORCEMENT_RUN_ATTEMPT"
          test "$(jq -r '.path' <<<"$enforcement_json")" = ".github/workflows/deploy-firestore-enforcement.yml"
          enforcement_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ENFORCEMENT_RUN_ID}/attempts/${ENFORCEMENT_RUN_ATTEMPT}/jobs?per_page=100")"
          jq -e '.jobs | any(.name == "deploy_enforcement_rules" and .status == "completed" and .conclusion == "success")' <<<"$enforcement_jobs" >/dev/null
          jq -e '.jobs | any(.name == "record_enforcement" and .status == "completed" and .conclusion == "success")' <<<"$enforcement_jobs" >/dev/null

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firestore-enforcement-evidence-${{ inputs.enforcement_run_id }}-${{ inputs.enforcement_run_attempt }}
          path: strict-enforcement-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.enforcement_run_id }}

      - name: Re-verify immutable strict-enforcement evidence for final attestation
        shell: bash
        env:
          ENFORCEMENT_EVIDENCE_SHA256: ${{ needs.migrate.outputs.enforcement_evidence_sha256 }}
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          evidence=strict-enforcement-evidence/enforcement.json
          test "$(sha256sum "$evidence" | cut -d ' ' -f 1)" = "$ENFORCEMENT_EVIDENCE_SHA256"
          node scripts/firestore-enforcement-evidence.mjs verify --file "$evidence" --evidence-sha256 "$ENFORCEMENT_EVIDENCE_SHA256" --revision "$RELEASE_REVISION" --enforcement-run-id "$ENFORCEMENT_RUN_ID" --enforcement-run-attempt "$ENFORCEMENT_RUN_ATTEMPT" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID" --rules-file firestore.rules

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Verify reviewed attestation trust root for final evidence
        shell: bash
        env:
          EVIDENCE_ATTESTATION_KMS_KEY_VERSION: ${{ vars.EVIDENCE_ATTESTATION_KMS_KEY_VERSION }}
        run: |
          set -euo pipefail
          trust_root=evidence-attestation-trust-root.json
          reviewed_kms_key_version="$(jq -er '.evidenceAttestationKmsKeyVersion' "$trust_root")"
          reviewed_kms_algorithm="$(jq -er '.evidenceAttestationKmsAlgorithm' "$trust_root")"
          reviewed_kms_fingerprint="$(jq -er '.evidenceAttestationPublicKeySpkiSha256' "$trust_root")"
          [[ "$reviewed_kms_key_version" =~ ^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]/locations/[a-z0-9-]{1,63}/keyRings/[A-Za-z0-9_-]{1,63}/cryptoKeys/[A-Za-z0-9_-]{1,63}/cryptoKeyVersions/[1-9][0-9]{0,19}$ ]]
          [[ "$reviewed_kms_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          case "$reviewed_kms_algorithm" in
            EC_SIGN_P256_SHA256|RSA_SIGN_PKCS1_2048_SHA256|RSA_SIGN_PKCS1_3072_SHA256|RSA_SIGN_PKCS1_4096_SHA256) ;;
            *) echo "Unsupported evidence attestation KMS algorithm." >&2; exit 1 ;;
          esac
          test "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" = "$reviewed_kms_key_version"
          IFS=/ read -r _ kms_project _ kms_location _ kms_keyring _ kms_key _ kms_version <<<"$reviewed_kms_key_version"
          metadata_directory="$RUNNER_TEMP/final-evidence-attestation-trust-root"
          mkdir -p "$metadata_directory"
          umask 077
          gcloud kms keys versions describe "$kms_version" --project="$kms_project" --location="$kms_location" --keyring="$kms_keyring" --key="$kms_key" --format='json(name,algorithm)' > "$metadata_directory/kms-metadata.json"
          gcloud kms keys versions get-public-key "$kms_version" --project="$kms_project" --location="$kms_location" --keyring="$kms_keyring" --key="$kms_key" --output-file="$metadata_directory/attestation-public-key.pem"
          node scripts/release-artifact.mjs verify-attestation-trust-root --root . --configured-kms-key-version "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" --metadata "$metadata_directory/kms-metadata.json" --public-key "$metadata_directory/attestation-public-key.pem"

      - name: Verify externally sealed post-mutation final-state evidence
        shell: bash
        env:
          EVIDENCE_ATTESTATION_KMS_KEY_VERSION: ${{ vars.EVIDENCE_ATTESTATION_KMS_KEY_VERSION }}
          FINAL_MIGRATION_EVIDENCE_ATTESTATION_B64: ${{ secrets.FINAL_MIGRATION_EVIDENCE_ATTESTATION_B64 }}
          FINAL_RULES_CUTOVER_EVIDENCE_B64: ${{ secrets.FINAL_RULES_CUTOVER_EVIDENCE_B64 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          ENFORCEMENT_EVIDENCE_SHA256: ${{ needs.migrate.outputs.enforcement_evidence_sha256 }}
          ENFORCEMENT_RUN_ATTEMPT: ${{ inputs.enforcement_run_attempt }}
          ENFORCEMENT_RUN_ID: ${{ inputs.enforcement_run_id }}
          MIGRATION_COMPLETED_AT: ${{ needs.migrate.outputs.migration_completed_at }}
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          MIGRATION_OWNER_ID: ${{ inputs.owner_id }}
          MIGRATION_RUN_ID: ${{ needs.migrate.outputs.migration_run_id }}
          MIGRATION_RUN_ATTEMPT: ${{ needs.migrate.outputs.migration_run_attempt }}
          RELEASE_REVISION: ${{ inputs.revision }}
          ROLLBACK_CIPHERTEXT_SHA256: ${{ needs.migrate.outputs.rollback_ciphertext_sha256 }}
          ROLLBACK_OBJECT_DESCRIPTOR_SHA256: ${{ needs.migrate.outputs.rollback_object_descriptor_sha256 }}
          ROLLBACK_KMS_KEY_VERSION: ${{ vars.ROLLBACK_KMS_KEY_VERSION }}
          ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64: ${{ secrets.ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64 }}
          ROLLBACK_SNAPSHOT_OBJECT_BUCKET: ${{ vars.ROLLBACK_SNAPSHOT_OBJECT_BUCKET }}
          ROLLBACK_SNAPSHOT_OBJECT_PREFIX: ${{ vars.ROLLBACK_SNAPSHOT_OBJECT_PREFIX }}
        run: |
          set -euo pipefail
          test -n "$FINAL_RULES_CUTOVER_EVIDENCE_B64"
          test -n "$FINAL_MIGRATION_EVIDENCE_ATTESTATION_B64"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET"
          test -n "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX"
          evidence_directory="$RUNNER_TEMP/reservation-migration-evidence"
          mkdir -p "$evidence_directory"
          umask 077
          printf '%s' "$FINAL_RULES_CUTOVER_EVIDENCE_B64" | base64 --decode > "$evidence_directory/rules-cutover-evidence.json"
          printf '%s' "$ROLLBACK_SNAPSHOT_OBJECT_DESCRIPTOR_B64" | base64 --decode > "$evidence_directory/rollback-snapshot-object.json"
          printf '%s' "$FINAL_MIGRATION_EVIDENCE_ATTESTATION_B64" | base64 --decode > "$evidence_directory/migration-evidence-attestation.json"
          attestation_file="$evidence_directory/migration-evidence-attestation.json"
          test ! -L "$attestation_file"
          test "$(stat --format=%s "$attestation_file")" -le 16384
          test "$(jq -cS 'keys' "$attestation_file")" = '["domain","payload","schemaVersion","signatureBase64"]'
          jq -e '.domain == "sonflash.reservation-migration-final-attestation" and .schemaVersion == 4 and (.schemaVersion | type) == "number"' "$attestation_file" >/dev/null
          test "$(jq -cS '.payload | keys' "$attestation_file")" = '["ciphertextSha256","databaseId","enforcementEvidenceSha256","enforcementRunAttempt","enforcementRunId","evidenceAttestationKmsAlgorithm","evidenceAttestationKmsKeyVersion","evidenceAttestationPublicKeySpkiSha256","evidenceSha256","migrationCompletedAt","migrationMode","migrationRunAttempt","migrationRunId","ownerCommitment","projectId","revision","rollbackKmsKeyVersion","rollbackSnapshotObject"]'
          attestation_payload="$evidence_directory/attestation-payload.json"
          attestation_signed="$evidence_directory/attestation-signed.json"
          jq -cS '.payload' "$attestation_file" > "$attestation_payload"
          jq -cS '{domain,schemaVersion,payload}' "$attestation_file" > "$attestation_signed"
          trust_root=evidence-attestation-trust-root.json
          reviewed_kms_key_version="$(jq -er '.evidenceAttestationKmsKeyVersion' "$trust_root")"
          reviewed_kms_algorithm="$(jq -er '.evidenceAttestationKmsAlgorithm' "$trust_root")"
          reviewed_kms_fingerprint="$(jq -er '.evidenceAttestationPublicKeySpkiSha256' "$trust_root")"
          test "$EVIDENCE_ATTESTATION_KMS_KEY_VERSION" = "$reviewed_kms_key_version"
          test "$(jq -r '.evidenceAttestationKmsKeyVersion' "$attestation_payload")" = "$reviewed_kms_key_version"
          test "$(jq -r '.evidenceAttestationKmsAlgorithm' "$attestation_payload")" = "$reviewed_kms_algorithm"
          test "$(jq -r '.evidenceAttestationPublicKeySpkiSha256' "$attestation_payload")" = "$reviewed_kms_fingerprint"
          expected_owner_commitment="$(printf '%s' "$MIGRATION_OWNER_ID" | sha256sum | cut -d ' ' -f 1)"
          test "$(jq -r '.ownerCommitment' "$attestation_payload")" = "$expected_owner_commitment"
          test "$(jq -r '.revision' "$attestation_payload")" = "$RELEASE_REVISION"
          test "$(jq -r '.projectId' "$attestation_payload")" = "$FIREBASE_PROJECT_ID"
          test "$(jq -r '.databaseId' "$attestation_payload")" = "$FIRESTORE_DATABASE_ID"
          test "$(jq -r '.enforcementRunId' "$attestation_payload")" = "$ENFORCEMENT_RUN_ID"
          test "$(jq -r '.enforcementRunAttempt' "$attestation_payload")" = "$ENFORCEMENT_RUN_ATTEMPT"
          test "$(jq -r '.enforcementEvidenceSha256' "$attestation_payload")" = "$ENFORCEMENT_EVIDENCE_SHA256"
          test "$(jq -r '.migrationRunId' "$attestation_payload")" = "$MIGRATION_RUN_ID"
          test "$(jq -r '.migrationRunAttempt' "$attestation_payload")" = "$MIGRATION_RUN_ATTEMPT"
          test "$(jq -r '.migrationMode' "$attestation_payload")" = "$MIGRATION_MODE"
          test "$(jq -r '.migrationCompletedAt' "$attestation_payload")" = "$MIGRATION_COMPLETED_AT"
          evidence_sha256="$(sha256sum "$evidence_directory/rules-cutover-evidence.json" | cut -d ' ' -f 1)"
          expected_ciphertext_sha256="$(jq -er '.ciphertextSha256 | select(type == "string" and test("^[a-f0-9]{64}$"))' "$attestation_payload")"
          test "$(jq -cS '.rollbackSnapshotObject' "$attestation_payload")" = "$(jq -cS '.' "$evidence_directory/rollback-snapshot-object.json")"
          object_descriptor_sha256="$(jq -cS '.' "$evidence_directory/rollback-snapshot-object.json" | sha256sum | cut -d ' ' -f 1)"
          test "$object_descriptor_sha256" = "$ROLLBACK_OBJECT_DESCRIPTOR_SHA256"
          test "$(jq -r '.evidenceSha256' "$attestation_payload")" = "$evidence_sha256"
          test "$(jq -r '.rollbackKmsKeyVersion' "$attestation_payload")" = "$ROLLBACK_KMS_KEY_VERSION"
          jq -r '.signatureBase64' "$attestation_file" | base64 --decode > "$evidence_directory/attestation-signature.bin"
          public_key="$RUNNER_TEMP/final-evidence-attestation-trust-root/attestation-public-key.pem"
          case "$reviewed_kms_algorithm" in
            EC_SIGN_P256_SHA256)
              openssl dgst -sha256 -verify "$public_key" -signature "$evidence_directory/attestation-signature.bin" "$attestation_signed"
              ;;
            RSA_SIGN_PKCS1_2048_SHA256|RSA_SIGN_PKCS1_3072_SHA256|RSA_SIGN_PKCS1_4096_SHA256)
              openssl dgst -sha256 -verify "$public_key" -signature "$evidence_directory/attestation-signature.bin" -sigopt rsa_padding_mode:pkcs1 "$attestation_signed"
              ;;
            *)
              echo "Unsupported evidence attestation KMS algorithm." >&2
              exit 1
              ;;
          esac
          node scripts/rollback-snapshot-object.mjs download --descriptor-file "$evidence_directory/rollback-snapshot-object.json" --output-file "$evidence_directory/rollback-snapshot.enc" --expected-bucket "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET" --expected-prefix "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX" --expected-sha256 "$expected_ciphertext_sha256"
          ciphertext_sha256="$(sha256sum "$evidence_directory/rollback-snapshot.enc" | cut -d ' ' -f 1)"
          test "$ciphertext_sha256" = "$ROLLBACK_CIPHERTEXT_SHA256"
          test "$expected_ciphertext_sha256" = "$ciphertext_sha256"
          node scripts/rules-cutover-evidence.mjs verify --file "$evidence_directory/rules-cutover-evidence.json" --evidence-sha256 "$evidence_sha256" --operation "$MIGRATION_OPERATION" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID" --client-revision "$RELEASE_REVISION" --rules-file firestore.rules --rollback-snapshot-ciphertext-file "$evidence_directory/rollback-snapshot.enc" --rollback-snapshot-object-file "$evidence_directory/rollback-snapshot-object.json" --rollback-snapshot-object-bucket "$ROLLBACK_SNAPSHOT_OBJECT_BUCKET" --rollback-snapshot-object-prefix "$ROLLBACK_SNAPSHOT_OBJECT_PREFIX" --kms-key-version "$ROLLBACK_KMS_KEY_VERSION" --not-before "$MIGRATION_COMPLETED_AT"
          printf 'Final Rules cutover evidence SHA-256: `%s`\n' "$evidence_sha256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reservation-migration-evidence-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reservation-migration-evidence/rules-cutover-evidence.json
            ${{ runner.temp }}/reservation-migration-evidence/rollback-snapshot-object.json
            ${{ runner.temp }}/reservation-migration-evidence/migration-evidence-attestation.json
          if-no-files-found: error
          retention-days: 2
