name: Offline Linux diagnostic
on:
  push:
    branches: [diagnostic/offline-linux-20260906]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npx playwright test e2e/learning-journey.spec.ts --grep 'downloads the published' --project=firefox --project=webkit --workers=1 --retries=0
        env:
          CI: 'true'
