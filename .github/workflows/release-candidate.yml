name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full immutable revision at the current main tip
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  validate_source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Verify exact current-main source before protected access
        shell: bash
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$GITHUB_SHA" = "$RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_REVISION" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  build:
    needs: validate_source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Re-verify protected release source
        shell: bash
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$GITHUB_SHA" = "$RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_REVISION" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify production release configuration
        run: npm run verify:release-config
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}

      - name: Build and verify the exact release candidate
        run: npm run verify
        env:
          CI: "true"
          RELEASE_REVISION: ${{ inputs.revision }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}

      - name: Seal verified deployable files
        run: >-
          node scripts/release-artifact.mjs seal
          --revision "${{ inputs.revision }}"
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
          --output artifacts/release-candidate-manifest.json

      - name: Publish approved digest in the workflow summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('artifacts/release-candidate-manifest.json', 'utf8'));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `Revision: \`${manifest.revision}\`\n\nCandidate run: \`${manifest.workflowRunId}\` attempt \`${manifest.workflowRunAttempt}\`\n\nCandidate SHA-256: \`${manifest.candidateSha256}\`\n`,
          );
          NODE

      - name: Retain browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the sealed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lingoflash-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            functions/lib
            functions/package.json
            functions/package-lock.json
            firestore.rules
            firestore.compatibility.rules
            firestore.indexes.json
            firebase.json
            firebase-applet-config.json
            artifacts/phase6-readiness.json
            evidence-attestation-trust-root.json
            artifacts/release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 14
