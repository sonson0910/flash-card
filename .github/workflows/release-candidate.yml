name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
        env:
          CI: "true"
          RELEASE_REVISION: ${{ github.sha }}

      - run: npm run build:release
        env:
          RELEASE_REVISION: ${{ github.sha }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}

      - run: npm run verify:secrets

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lingoflash-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
