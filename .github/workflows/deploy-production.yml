name: Deploy production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA already reviewed for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Require an exact commit SHA
        shell: bash
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify the reviewed revision
        run: npm run verify
        env:
          CI: "true"
          RELEASE_REVISION: ${{ inputs.revision }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Deploy only after verification and environment approval
        run: npx --yes firebase-tools@15.23.0 deploy --non-interactive
        env:
          CI: "true"
          RELEASE_REVISION: ${{ inputs.revision }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
