name: Deploy production artifact

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full revision shown by a successful release-candidate run
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      candidate_sha256:
        description: Candidate SHA-256 shown in that workflow summary
        required: true
        type: string
      promote_functions:
        description: Deploy approved Functions before the compatible Hosting artifact
        required: true
        default: false
        type: boolean
      app_check_observation_ref:
        description: Required approval/evidence reference when promoting Functions
        required: false
        type: string
      firestore_safety_run_id:
        description: Successful Firestore backup, restore, and TTL verification run ID required by promotion
        required: true
        type: string
      firestore_safety_receipt_sha256:
        description: SHA-256 of the Firestore release-safety receipt required by promotion
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: firestore-production-mutations
  cancel-in-progress: false

jobs:
  validate_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable candidate inputs
        shell: bash
        env:
          APP_CHECK_OBSERVATION_REF: ${{ inputs.app_check_observation_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIRESTORE_SAFETY_RECEIPT_SHA256: ${{ inputs.firestore_safety_receipt_sha256 }}
          FIRESTORE_SAFETY_RUN_ID: ${{ inputs.firestore_safety_run_id }}
          REVISION: ${{ inputs.revision }}
          PROMOTE_FUNCTIONS: ${{ inputs.promote_functions }}
        run: |
          test -n "$DEFAULT_BRANCH"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          if [[ ! "$REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "revision must be a full lowercase 40- or 64-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "candidate_run_id must be a positive workflow run ID" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "candidate_sha256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi
          if [[ ! "$FIRESTORE_SAFETY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "firestore_safety_run_id must be a positive workflow run ID" >&2
            exit 1
          fi
          if [[ ! "$FIRESTORE_SAFETY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "firestore_safety_receipt_sha256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi
          if [[ "$PROMOTE_FUNCTIONS" == "true" && ! "$APP_CHECK_OBSERVATION_REF" =~ ^[A-Za-z0-9._:/-]{8,200}$ ]]; then
            echo "Functions promotion requires a bounded App Check observation reference" >&2
            exit 1
          fi

      - name: Verify release-candidate workflow provenance
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$REVISION"
          run_path="$(jq -r '.path' <<<"$run_json")"
          test "$run_path" = ".github/workflows/release-candidate.yml"

      - name: Verify Firestore release-safety provenance and receipt identity
        shell: bash
        env:
          FIRESTORE_SAFETY_RUN_ID: ${{ inputs.firestore_safety_run_id }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FIRESTORE_SAFETY_RUN_ID}")"
          test "$(jq -er '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -er '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -er '.path' <<<"$run_json")" = ".github/workflows/verify-firestore-release-safety.yml"
          test "$(jq -er '.head_sha' <<<"$run_json")" = "$REVISION"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FIRESTORE_SAFETY_RUN_ID}/artifacts?name=firestore-release-safety-${REVISION}-${FIRESTORE_SAFETY_RUN_ID}")"
          test "$(jq -er '[.artifacts[] | select(.expired == false and .workflow_run.id == ($run | tonumber))] | length' --arg run "$FIRESTORE_SAFETY_RUN_ID" <<<"$artifact_json")" = "1"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Verify revision ancestry and exact checkout
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$REVISION" "origin/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download the sealed candidate from its source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lingoflash-${{ inputs.revision }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download the exact Firestore release-safety receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firestore-release-safety-${{ inputs.revision }}-${{ inputs.firestore_safety_run_id }}
          path: firestore-release-safety
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.firestore_safety_run_id }}

      - name: Verify the Firestore release-safety receipt
        shell: bash
        env:
          FIRESTORE_SAFETY_RECEIPT_SHA256: ${{ inputs.firestore_safety_receipt_sha256 }}
          FIRESTORE_SAFETY_RUN_ID: ${{ inputs.firestore_safety_run_id }}
          REVISION: ${{ inputs.revision }}
        run: |
          receipt=firestore-release-safety/receipt.json
          test "$(sha256sum "$receipt" | cut -d' ' -f1)" = "$FIRESTORE_SAFETY_RECEIPT_SHA256"
          jq -e \
            --arg revision "$REVISION" \
            --arg runId "$FIRESTORE_SAFETY_RUN_ID" \
            '([keys[]] | sort) == ["backup","completedAt","restore","revision","runId","schemaVersion","source","status","ttlPolicies"]
            and .schemaVersion == 1
            and .status == "verified"
            and .revision == $revision
            and .runId == $runId
            and .source == {projectId:"encoded-hangout-433912-h2",databaseId:"ai-studio-945b4052-4462-4668-8936-277f09f07a37"}
            and (.backup.bucket | type == "string" and test("^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$"))
            and (.backup.exportUri | type == "string")
            and (.backup as $backup | ($backup.exportUri | startswith("gs://" + $backup.bucket + "/firestore-backups/" + $revision + "/" + $runId + "-")))
            and .backup.retentionLocked == true
            and (.backup.retentionSeconds | type == "number" and . >= 7776000)
            and (.backup.documentCount | type == "number" and . >= 0 and floor == .)
            and (.restore.databaseId | test("^release-restore-" + $runId + "-[1-9][0-9]{0,9}$"))
            and .restore.documentCount == .backup.documentCount
            and .restore.deletedAfterVerification == true
            and (.ttlPolicies | sort_by(.collectionGroup)) == [
              {collectionGroup:"library_facet_receipts",field:"expiresAt",state:"ACTIVE"},
              {collectionGroup:"shared_deck_receipts",field:"expiresAt",state:"ACTIVE"}
            ]
            and (.completedAt | type == "string" and test("^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' \
            "$receipt"

      - name: Verify every sealed candidate byte
        run: node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "${{ inputs.revision }}" --workflow-run-id "${{ inputs.candidate_run_id }}" --candidate-sha256 "${{ inputs.candidate_sha256 }}"

      - name: Retain the validated candidate for protected deployment jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-candidate-${{ github.run_id }}
          path: candidate
          if-no-files-found: error
          retention-days: 2

  deploy_hosting:
    needs: [validate_candidate, deploy_functions]
    if: ${{ !cancelled() && needs.validate_candidate.result == 'success' && (needs.deploy_functions.result == 'success' || (!inputs.promote_functions && needs.deploy_functions.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-hosting
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Hosting checkout
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-candidate-${{ github.run_id }}
          path: candidate

      - name: Re-verify the protected Hosting candidate and target
        shell: bash
        env:
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          firebase_project_pattern='^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          firestore_database_pattern='^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$'
          if [[ ! "$FIREBASE_PROJECT_ID" =~ $firebase_project_pattern ]]; then
            echo "Protected FIREBASE_PROJECT_ID is missing or invalid." >&2
            exit 1
          fi
          if [[ ! "$FIRESTORE_DATABASE_ID" =~ $firestore_database_pattern ]]; then
            echo "Protected FIRESTORE_DATABASE_ID is missing or invalid." >&2
            exit 1
          fi
          node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "${{ inputs.revision }}" --workflow-run-id "${{ inputs.candidate_run_id }}" --candidate-sha256 "${{ inputs.candidate_sha256 }}" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID"
          node scripts/release-artifact.mjs promote-config --root candidate --source firebase.json --output firebase.promoted.json

      - name: Install the sealed Firebase CLI dependency tree
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the sealed Firebase CLI version
        working-directory: candidate
        shell: bash
        run: test "$(./node_modules/.bin/firebase --version)" = "15.29.0"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Promote only the sealed Hosting artifact
        working-directory: candidate
        run: ./node_modules/.bin/firebase deploy --only hosting --config firebase.promoted.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

  deploy_functions:
    if: ${{ inputs.promote_functions }}
    needs: validate_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact Functions checkout
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$REVISION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-candidate-${{ github.run_id }}
          path: candidate

      - name: Re-verify the protected Functions candidate and target
        shell: bash
        env:
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          firebase_project_pattern='^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          firestore_database_pattern='^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$'
          if [[ ! "$FIREBASE_PROJECT_ID" =~ $firebase_project_pattern ]]; then
            echo "Protected FIREBASE_PROJECT_ID is missing or invalid." >&2
            exit 1
          fi
          if [[ ! "$FIRESTORE_DATABASE_ID" =~ $firestore_database_pattern ]]; then
            echo "Protected FIRESTORE_DATABASE_ID is missing or invalid." >&2
            exit 1
          fi
          node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "${{ inputs.revision }}" --workflow-run-id "${{ inputs.candidate_run_id }}" --candidate-sha256 "${{ inputs.candidate_sha256 }}" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID"
          node scripts/release-artifact.mjs promote-config --root candidate --source firebase.json --output firebase.promoted.json

      - name: Install the sealed Firebase CLI dependency tree
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the sealed Firebase CLI version
        working-directory: candidate
        shell: bash
        run: test "$(./node_modules/.bin/firebase --version)" = "15.29.0"

      - name: Materialize sealed Functions runtime dependencies
        run: npm ci --prefix candidate/functions --omit=dev --ignore-scripts --no-audit --no-fund

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Verify Pro intent Firestore index is ready before Functions promotion
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
        run: |
          set -euo pipefail
          gcloud firestore indexes composite list --project="$FIREBASE_PROJECT_ID" --database="$FIRESTORE_DATABASE_ID" --format=json \
            | node scripts/verify-entitlement-index.mjs "$FIREBASE_PROJECT_ID" "$FIRESTORE_DATABASE_ID"

      - name: Promote only the sealed Functions artifact after App Check approval
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
      
          parameter_file="functions/.env.${FIREBASE_PROJECT_ID}"
      
          cleanup() {
            rm -f -- "$parameter_file"
          }
          trap cleanup EXIT
      
          umask 077
          printf '%s\n' 'ENFORCE_APP_CHECK=true' > "$parameter_file"
      
          test -f "$parameter_file"
          grep -qxF 'ENFORCE_APP_CHECK=true' "$parameter_file"
      
          ./node_modules/.bin/firebase deploy --only functions --config firebase.promoted.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          APP_CHECK_OBSERVATION_REF: ${{ inputs.app_check_observation_ref }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
