name: Deploy staging candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full revision shown by a successful release-candidate run
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      candidate_sha256:
        description: Candidate SHA-256 shown in that workflow summary
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Validate immutable candidate and protected staging target
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE_ID: ${{ vars.FIREBASE_HOSTING_SITE_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          REVISION: ${{ inputs.revision }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$FIRESTORE_DATABASE_ID" =~ ^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$ ]]
          test "$FIREBASE_HOSTING_SITE_ID" = "$FIREBASE_PROJECT_ID"
          test "$STAGING_ORIGIN" = "https://$FIREBASE_HOSTING_SITE_ID.web.app"

      - name: Verify release-candidate workflow provenance and artifact identity
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -er '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -er '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -er '.head_sha' <<<"$run_json")" = "$REVISION"
          test "$(jq -er '.path' <<<"$run_json")" = ".github/workflows/release-candidate.yml"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?name=lingoflash-$REVISION")"
          test "$(jq -er '[.artifacts[] | select(.expired == false and .workflow_run.id == ($run | tonumber))] | length' --arg run "$CANDIDATE_RUN_ID" <<<"$artifact_json")" = "1"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current protected workflow checkout and candidate ancestry
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$REVISION" "origin/$DEFAULT_BRANCH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download the exact sealed candidate from its source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lingoflash-${{ inputs.revision }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify every candidate byte and protected staging binding
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          REVISION: ${{ inputs.revision }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
        run: |
          node scripts/release-artifact.mjs verify --root candidate --manifest artifacts/release-candidate-manifest.json --revision "$REVISION" --workflow-run-id "$CANDIDATE_RUN_ID" --candidate-sha256 "$CANDIDATE_SHA256" --project-id "$FIREBASE_PROJECT_ID" --database-id "$FIRESTORE_DATABASE_ID" --origin "$STAGING_ORIGIN"
          node scripts/release-artifact.mjs promote-config --root candidate --source firebase.json --output firebase.promoted.json --database-id "$FIRESTORE_DATABASE_ID"

      - name: Install and verify the sealed Firebase CLI
        working-directory: candidate
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/firebase --version)" = "15.29.0"

      - name: Materialize sealed Functions runtime dependencies
        run: npm ci --prefix candidate/functions --omit=dev --ignore-scripts --no-audit --no-fund

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy only sealed Firestore Rules
        working-directory: candidate
        run: ./node_modules/.bin/firebase deploy --only firestore:rules --config firebase.promoted.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Deploy only sealed Functions
        working-directory: candidate
        run: ./node_modules/.bin/firebase deploy --only functions --config firebase.promoted.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Deploy only sealed Hosting bytes
        working-directory: candidate
        run: ./node_modules/.bin/firebase deploy --only hosting --config firebase.promoted.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Verify live HTTPS bytes and emit target-bound receipt
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          REVISION: ${{ inputs.revision }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
        run: |
          mkdir -p artifacts/live-staging
          health_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output artifacts/live-staging/health.json --write-out '%{http_code}' "$STAGING_ORIGIN/health.json")"
          sw_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error --output artifacts/live-staging/sw.js --write-out '%{http_code}' "$STAGING_ORIGIN/sw.js")"
          test "$health_status" = "200"
          test "$sw_status" = "200"
          jq -e --arg revision "$REVISION" '.revision == $revision and .status == "ok"' artifacts/live-staging/health.json
          test "$(sha256sum candidate/dist/sw.js | cut -d' ' -f1)" = "$(sha256sum artifacts/live-staging/sw.js | cut -d' ' -f1)"
          export MANIFEST_SHA256="$(sha256sum candidate/artifacts/release-candidate-manifest.json | cut -d' ' -f1)"
          export READINESS_SHA256="$(sha256sum candidate/artifacts/phase6-readiness.json | cut -d' ' -f1)"
          export HEALTH_SHA256="$(sha256sum artifacts/live-staging/health.json | cut -d' ' -f1)"
          export SERVICE_WORKER_SHA256="$(sha256sum artifacts/live-staging/sw.js | cut -d' ' -f1)"
          export DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          node scripts/staging-deployment-receipt.mjs artifacts/staging-deployment-receipt.json
          echo "Receipt SHA-256: $(sha256sum artifacts/staging-deployment-receipt.json | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.' artifacts/staging-deployment-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable staging deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-staging-receipt-${{ inputs.revision }}-${{ github.run_id }}
          path: artifacts/staging-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
