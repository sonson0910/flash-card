name: Verify release candidate artifact

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase immutable revision from the release candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      candidate_sha256:
        description: Candidate SHA-256 from the release candidate summary
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-release-artifact
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate protected invocation
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ inputs.revision }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          if [[ ! "$REVISION" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "revision must be a full lowercase 40- or 64-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "candidate_run_id must be a positive workflow run ID" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "candidate_sha256 must be a lowercase SHA-256 digest" >&2
            exit 1
          fi

      # This checkout supplies only the verifier from the current default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current default branch and candidate ancestry
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REVISION" "origin/$DEFAULT_BRANCH"

      - name: Verify source run provenance and exact artifact metadata
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -er '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -er '.event' <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -er '.head_sha' <<<"$run_json")" = "$REVISION"
          test "$(jq -er '.path' <<<"$run_json")" = ".github/workflows/release-candidate.yml"

          artifact_name="lingoflash-$REVISION"
          artifacts_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?name=lingoflash-$REVISION&per_page=100")"
          artifact_count="$(jq -er --arg artifact_name "$artifact_name" '[.artifacts[]? | select(.name == $artifact_name)] | length' <<<"$artifacts_json")"
          test "$artifact_count" = "1"
          artifact_json="$(jq -cer --arg artifact_name "$artifact_name" --arg CANDIDATE_RUN_ID "$CANDIDATE_RUN_ID" '
            [.artifacts[]? | select(.name == $artifact_name)]
            | if length != 1 then error("expected exactly one release artifact") else .[0] end
            | if .workflow_run.id == ($CANDIDATE_RUN_ID | tonumber) then . else error("release artifact source run mismatch") end
            | if .expired == false then . else error("release artifact is expired") end
          ' <<<"$artifacts_json")"

          artifact_id="$(jq -er '.id | tostring | select(test("^[1-9][0-9]{0,19}$"))' <<<"$artifact_json")"
          artifact_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$artifact_json")"
          artifact_expires_at="$(jq -er '.expires_at | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"))' <<<"$artifact_json")"
          {
            echo "RELEASE_RECEIPT_ARTIFACT_ID=$artifact_id"
            echo "RELEASE_RECEIPT_ARTIFACT_DIGEST=$artifact_digest"
            echo "RELEASE_RECEIPT_ARTIFACT_EXPIRES_AT=$artifact_expires_at"
          } >> "$GITHUB_ENV"

      - name: Download the exact source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lingoflash-${{ inputs.revision }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify sealed bytes with the current default branch verifier
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          node scripts/release-artifact.mjs verify \
            --root candidate \
            --manifest artifacts/release-candidate-manifest.json \
            --revision "$REVISION" \
            --workflow-run-id "$CANDIDATE_RUN_ID" \
            --candidate-sha256 "$CANDIDATE_SHA256"

      - name: Emit bounded read-only verification receipt
        shell: bash
        env:
          RELEASE_RECEIPT_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_RECEIPT_REPOSITORY_NAME: ${{ github.repository }}
          RELEASE_RECEIPT_VERIFICATION_RUN_ID: ${{ github.run_id }}
          RELEASE_RECEIPT_VERIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RECEIPT_SOURCE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_RECEIPT_REVISION: ${{ inputs.revision }}
          RELEASE_RECEIPT_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          manifest="candidate/artifacts/release-candidate-manifest.json"
          readiness="candidate/artifacts/phase6-readiness.json"
          test -f "$manifest"
          test -f "$readiness"
          RELEASE_RECEIPT_MANIFEST_SHA256="$(sha256sum "$manifest" | awk '{print $1}')"
          RELEASE_RECEIPT_READINESS_SHA256="$(sha256sum "$readiness" | awk '{print $1}')"
          export RELEASE_RECEIPT_MANIFEST_SHA256 RELEASE_RECEIPT_READINESS_SHA256
          mkdir -p artifacts
          node scripts/release-receipt.mjs artifacts/release-verification-receipt.json

      - name: Publish bounded verification summary
        shell: bash
        run: |
          set -euo pipefail
          jq -r '"READ-ONLY release artifact verification: \(.status)\nRevision: \(.revision)\nCandidate SHA-256: \(.candidateSha256)\nManifest SHA-256: \(.manifestSha256)\nReadiness SHA-256: \(.readinessSha256)\nArtifact ID: \(.artifactId)\nArtifact digest: \(.artifactDigest)\nArtifact expires: \(.artifactExpiresAt)"' \
            artifacts/release-verification-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-receipt-${{ inputs.revision }}-${{ github.run_id }}
          path: artifacts/release-verification-receipt.json
          if-no-files-found: error
          retention-days: 90
